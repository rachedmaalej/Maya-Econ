/* ── INTERNATIONAL TRADE ── */
{cat:'trade',diff:'medium',marks:4,type:'Explain (Diagram)',src:'M19 · P2 Q1c',
 q:'Using an international trade diagram, explain the effect of a tariff on the imports of tinplate steel into the US.',
 tags:['tariff','international trade diagram','consumer surplus','producer surplus','welfare loss'],
 hints:['Draw international trade diagram: domestic S and D, world supply (horizontal at Pw)','With no tariff: imports = Qd − Qs (gap between domestic demand and supply at Pw)','Tariff shifts world supply up to Pw + tariff → domestic price rises','Effect: domestic production rises (from Qs to Qs2); consumption falls (from Qd to Qd2); imports fall','Consumer surplus falls; domestic producer surplus rises; government earns tariff revenue','Net welfare loss = two deadweight triangles']},

{cat:'trade',diff:'medium',marks:4,type:'Explain (Diagram)',src:'N19 · P2 Q1c',
 q:'Using an international trade diagram, explain the likely impact of Japan "removing the current 30% tariff" on the level of cheddar cheese imports.',
 tags:['tariff removal','free trade','imports','consumer surplus','cheese'],
 hints:['Draw international trade diagram: domestic S and D; world price + 30% tariff; world price without tariff','Removing tariff: price falls from (Pw + tariff) to Pw','Imports increase (from Q2−Q1 to Q4−Q3)','Domestic production falls; consumption rises','Consumer surplus increases; domestic producer surplus falls; government loses tariff revenue','Net welfare gain to Japan overall (free trade improves allocative efficiency)']},

{cat:'trade',diff:'medium',marks:4,type:'Explain (Diagram)',src:'N20 · P2 Q2b',
 q:'Using an international trade diagram, explain the outcome on US producers of the introduction of a tariff on imports from China.',
 tags:['tariff','domestic producers','producer surplus','US-China trade war'],
 hints:['Draw international trade diagram: domestic D and S; horizontal world supply at Pw','Tariff shifts world supply to Pw + tariff → domestic price rises','Domestic production increases (from Qs to Qs2) as US producers can now profitably produce more','Domestic producer surplus increases — this is the key benefit for US producers','Domestic consumers lose surplus (pay higher price); government gains tariff revenue','Net welfare effect: deadweight loss overall, but producers gain']},

/* ── EXCHANGE RATES ── */
{cat:'exr',diff:'medium',marks:4,type:'Explain (Diagram)',src:'M19 · P2 Q2c',
 q:'Using an exchange rate diagram, explain how reducing interest rates might lead to a fall in the value of the rupee.',
 tags:['exchange rate','interest rates','capital outflows','depreciation','rupee'],
 hints:['Draw forex diagram: exchange rate on y-axis; quantity of rupees on x-axis','Lower interest rates in India → Indian financial assets less attractive to foreign investors','Capital outflows → investors sell rupees to buy other currencies','Supply of rupees increases (supply curve shifts right) → rupee depreciates','Alternative: demand for rupees falls (D shifts left) if international investors pull out','Show: new lower equilibrium exchange rate for the rupee']},

{cat:'exr',diff:'medium',marks:4,type:'Explain (Diagram)',src:'N19 · P2 Q2c',
 q:'Using an exchange rate diagram, explain one reason for the appreciation of the Canadian dollar.',
 tags:['exchange rate','appreciation','interest rates','Canada','capital inflows'],
 hints:['Draw forex diagram for Canadian dollar (CAD)','Bank of Canada raised interest rates from 0.5% to 0.75%','Higher interest rates attract foreign investors seeking better returns → they buy CAD','Demand for CAD increases (D curve shifts right)','New equilibrium: higher exchange rate → CAD appreciates against USD','Also: strong GDP growth data and optimism boosted demand for CAD']},

{cat:'exr',diff:'medium',marks:4,type:'Explain (Diagram)',src:'N20 · P2 Q1b',
 q:'Using an exchange rate diagram, explain how raising interest rates would "stop the fall in the peso\'s value".',
 tags:['exchange rate','interest rates','Argentina','peso','currency intervention'],
 hints:['Draw forex diagram: S and D for Argentine peso','Peso falling: supply of pesos > demand → exchange rate declining','Raising interest rates (to 40%): attracts foreign capital inflows → investors buy pesos to earn high returns','Demand for peso increases (D shifts right) → peso stabilises or appreciates','Also: central bank can sell foreign reserves (USD) to buy pesos → D for peso rises further','Diagram should show: D right shift → higher (or stable) exchange rate']},

/* ── AD/AS MODEL ── */
{cat:'adas',diff:'medium',marks:4,type:'Explain (Diagram)',src:'M19 · P2 Q2b',
 q:'Using an AD/AS diagram, explain how increased import expenditure might affect economic growth in the Indian economy.',
 tags:['aggregate demand','imports','net exports','AD/AS','economic growth'],
 hints:['Draw AD/AS diagram','Increased import expenditure → M rises → net exports (X−M) fall → AD decreases (AD = C+I+G+(X−M))','AD shifts left → real GDP falls → economic growth slows or falls','May also worsen current account deficit → further pressure on exchange rate','Counter-effect: if imports are productive capital goods → can improve future LRAS/SRAS','In short run: rising imports reduce AD and growth']},

{cat:'adas',diff:'medium',marks:4,type:'Explain (Diagram)',src:'N19 · P2 Q1b',
 q:'Using an AD/AS diagram, explain the impact of the Japan-EU trade agreement (JEEPA) on Japan\'s economic growth.',
 tags:['AD/AS','trade agreement','exports','economic growth','JEEPA'],
 hints:['Draw AD/AS diagram for Japan','JEEPA: EU will lower tariffs on Japanese cars → Japanese exports to EU increase','Net exports (X−M) component of AD rises → AD shifts right','Real GDP increases → economic growth','May also attract more FDI as Japan gains market access → investment (I) component of AD rises','LRAS may eventually shift right if trade boosts productive capacity']},

{cat:'adas',diff:'medium',marks:4,type:'Explain (Diagram)',src:'N20 · P2 Q1c',
 q:'Using an AD/AS diagram, explain how the peso\'s weakness is contributing to inflation in Argentina.',
 tags:['exchange rate','depreciation','cost-push','AD/AS','inflation','peso'],
 hints:['Draw AD/AS diagram for Argentina','Peso depreciation → imported goods (especially oil) become more expensive in peso terms','Imported inputs cost more → production costs rise → SRAS shifts left (cost-push inflation)','SRAS shifts left → price level rises (inflation), real GDP falls','Also: cheaper peso may stimulate exports → AD shifts right → demand-pull inflation too','Both channels contribute to higher price level in Argentina']},

{cat:'adas',diff:'medium',marks:4,type:'Explain (Diagram)',src:'N20 · P2 Q2c',
 q:'Using an AD/AS diagram, explain the desired impact of China\'s "eased monetary policy" on its economic growth.',
 tags:['monetary easing','AD/AS','China','economic growth','interest rates'],
 hints:['Draw AD/AS diagram for China','Eased monetary policy: lower interest rates / easier credit conditions','Lower rates → cheaper borrowing → businesses invest more (I rises); consumers spend more (C rises)','AD shifts right → real GDP increases → economic growth accelerates','Desired effect: prevent sharp economic slowdown amid trade war pressures','Also: subsidised lending to small firms directly boosts their investment']},

{cat:'adas',diff:'medium',marks:4,type:'Explain (Diagram)',src:'N19 · P2 Q2b',
 q:'Using an AD/AS diagram, explain the likely impact on the Canadian economy of the increase in the official interest rate.',
 tags:['interest rate increase','contractionary','AD/AS','Canada','monetary policy'],
 hints:['Draw AD/AS diagram for Canada','Bank of Canada raised rate from 0.5% to 0.75%','Higher rates → more expensive borrowing → consumption (C) and investment (I) fall','Net exports may also fall if higher rates attract foreign capital → CAD appreciates → exports less competitive','AD shifts left → lower inflationary pressure; real GDP growth slows slightly','Canada\'s motivation: GDP growth above potential (3.5%) → preemptive tightening to prevent inflation']},

{cat:'adas',diff:'medium',marks:4,type:'Explain (Diagram)',src:'N19 · P2 Q4c',
 q:'Using a circular flow of income diagram (in an open economy), explain the impact that increased export revenues could have on Nepal\'s national income.',
 tags:['circular flow','exports','injections','national income','multiplier'],
 hints:['Draw circular flow of income for open economy: households, firms; injections (I, G, X) and leakages (S, T, M)','Increased export revenues = increase in injection (X) into the circular flow','More export revenues → firms earn more → pay higher wages/dividends → households have more income','Multiplier effect: initial export injection leads to multiple rounds of spending → national income rises by a multiple','Show: X ↑ → injection increases → circular flow expands → national income (GDP) rises']},

/* ── PRICE FLOORS ── */
{cat:'pf',diff:'medium',marks:4,type:'Explain (Diagram)',src:'N19 · P2 Q3b',
 q:'Using a demand and supply diagram, explain how a decrease in the minimum price of cocoa would affect the welfare loss associated with the minimum price in Côte d\'Ivoire.',
 tags:['minimum price','price floor','welfare loss','deadweight loss','cocoa'],
 hints:['Draw D&S diagram with minimum price (price floor) above equilibrium','At original minimum price: surplus (Qs > Qd) → deadweight loss triangle','Decrease in minimum price: minimum price moves closer to equilibrium → smaller surplus','Welfare loss (deadweight loss triangle) decreases as the gap between Qs and Qd narrows','If minimum price falls to equilibrium: no deadweight loss, no surplus','Show: two diagrams or one diagram with old and new minimum prices']},

{cat:'pf',diff:'medium',marks:4,type:'Explain (Diagram)',src:'N19 · P2 Q3c',
 q:'Using a demand and supply diagram, explain why the government\'s decision to "cut the minimum price" paid to cocoa farmers is likely to decrease farmers\' incomes.',
 tags:['minimum price','price floor','farmer income','cocoa','total revenue'],
 hints:['Draw D&S diagram with minimum price above equilibrium','At minimum price: farmers receive higher price but sell less (Qd < Qs, government must buy surplus)','"Cut the minimum price": if cut to below equilibrium or closer to equilibrium','Lower price × lower or same quantity sold → total revenue (income) for farmers falls','If price floor is still above equilibrium: price falls → revenue = P × Qd → if PED inelastic, revenue falls','Show: farmer income = price × quantity sold; both may fall or price fall dominates income effect']},

/* ── EXTERNALITIES ── */
{cat:'ext',diff:'medium',marks:4,type:'Explain (Diagram)',src:'N20 · P2 Q3c',
 q:'Using an externalities diagram, explain how "greater access to education" for girls in Pakistan could reduce market failure.',

{cat:'trade',diff:'hard',marks:8,type:'Discuss',src:'M19 · P2 Q1d',
 q:'Using information from the text and your knowledge of economics, discuss possible economic impacts of the tariff on tinplate steel on different stakeholders.',
 tags:['tariff','tinplate steel','stakeholders','trade protection','consumer','producer','government'],
 hints:['Tariff on tinplate steel imports raises domestic price of tinplate → increases input costs for US tin can manufacturers','Negative impact on tin can manufacturers: competitive disadvantage vs other packaging (plastic, glass) not subject to tariff','Domestic tinplate steel producers benefit: protected from import competition → higher output and revenue','US government: gains tariff revenue','Consumers: may face higher food prices (canned food costs rise); especially harmful for the 42m low-income Americans dependent on canned food','Workers: 10,000 tin can manufacturing jobs at risk; domestic steel jobs protected','Overall evaluation: tariff designed to protect steel producers but harms downstream industries (can makers); net welfare effect likely negative','Consider: whether domestic tinplate production can realistically fill the supply gap (was only 57% of demand)']},

{cat:'exr',diff:'hard',marks:8,type:'Discuss',src:'M19 · P2 Q2d',
 q:'Using information from the text and data, discuss the possible economic consequences of the increasing value of the rupee for India\'s inflation rate, employment, economic growth and current account balance.',
 tags:['exchange rate','appreciation','India','rupee','inflation','current account','employment'],
 hints:['Rupee appreciation → imports cheaper → cost-push deflation → inflation rate falls (positive for price stability)','Rupee appreciation → exports more expensive → Indian exporters less competitive → export revenues fall','Lower exports → ↓ GDP growth; export sectors (e.g., IT services, manufacturing) may cut employment','Current account deteriorates: exports fall, imports rise → trade deficit widens','Manufacturing employment: export-oriented sectors (textiles, pharmaceuticals) may lay off workers as orders fall','BUT: lower import costs benefit Indian firms that use imported inputs → production costs fall','Discuss: not all effects are negative; net impact depends on relative magnitudes and India\'s export/import elasticities','Policy implication: India may prefer to keep rupee competitive for export-led growth']},

{cat:'dev',diff:'hard',marks:8,type:'Evaluate',src:'M19 · P2 Q3d',
 q:'Using information from the text and your knowledge of economics, evaluate the government policies being used to promote economic development in Bhutan.',
 tags:['Bhutan','economic development','hydropower','education','FDI','tied aid','debt'],
 hints:['Hydropower investment: major government intervention; generates export revenues (80% to India); GDP growth projected at 11.7%','BUT: funded by concessional loans → Bhutan is now second-most indebted nation in Asia (118% of GDP)','Tied aid from India: conditions include Indian companies leading projects → may not reflect Bhutan\'s cheapest/best options; dependence on India','University education expansion: increases human capital → positive for long-term growth; but graduates outnumber government jobs → educated unemployment','Tourism promotion: diversifies economy; generates foreign exchange; sustainable income source','Deregulation/FDI attraction: reduces red tape → may attract foreign investment → economic diversification','Agriculture promotion: leverages climate advantage for fruit export → potentially sustainable sector','Evaluation: strong GDP growth but high debt is a risk; dependence on India (tied aid) limits policy autonomy; education without private sector jobs is counterproductive; need to balance state-led and market-based development']},

{cat:'dev',diff:'hard',marks:8,type:'Evaluate',src:'M19 · P2 Q4d',
 q:'Using information from the text and data, evaluate the factors that may allow Peru to continue to achieve high rates of economic growth in the future.',
 tags:['Peru','economic growth','FDI','mining','China','free trade','structural reform'],
 hints:['Favourable factors: rich natural resource base (copper, gold, silver, oil) → commodity export revenues','Strong FDI from China (e.g., US$2bn hydroelectric plant purchase) → capital investment without domestic savings needed','17 free trade agreements including US, China, EU → access to large markets','Macroeconomic stability: low inflation (avg 2.9%), falling current account deficit (4.9% → 2.8% GDP)','Government plans to increase public investment as mining slows → fiscal stimulus','Risk factors: over-dependence on commodities → vulnerable to price cycles (e.g., Chinese slowdown)','Weak private investment: private sector needs to diversify beyond mining','Environmental concerns: deregulation opposed by unions and environmental groups → social conflict','Informal economy: large size limits tax revenue and productivity','Evaluation: Peru has strong foundations but excessive commodity dependence is a vulnerability; structural reforms (productivity, reduce informal sector) needed for sustainable growth']},

{cat:'exr',diff:'hard',marks:8,type:'Discuss',src:'N19 · P2 Q2d',
 q:'Using information from the text and data, discuss the possible effects on the Canadian economy of the strengthening of the Canadian dollar against the US dollar.',
 tags:['exchange rate','appreciation','Canada','exports','imports','current account','inflation'],
 hints:['CAD appreciation → Canadian exports more expensive in USD terms → US buyers may switch to cheaper US producers','Motor vehicles and parts (18% of exports) and energy (14%) particularly affected','US is 76% of Canada\'s export destination → very sensitive to USD/CAD exchange rate','Benefits: cheaper imports for Canadian consumers; lower inflation (cheaper USD goods)','Stronger CAD → more Canadians travel to US → spending abroad increases → negative for Canadian domestic consumption','Current account deficit may worsen: falling export revenues + rising import spending','BUT: effects lag (months before consumers see impact per the economist quote)','Industries vary: energy exporters hurt; firms with USD-denominated costs benefit','Evaluation: net impact likely negative for growth given US is 76% of exports; central bank raised rates expecting manageable impact; watch current account']},

{cat:'dev',diff:'hard',marks:8,type:'Discuss',src:'N19 · P2 Q3d',

 tags:['women empowerment','gender equality','economic development','human capital','Côte d\'Ivoire','HDI'],
 hints:['Table 3 data: female GNI/capita = $2,136 vs male $4,155; female mean years schooling = 3.9 vs 6.1; female HDI = 0.421 vs male 0.517','Labour force participation: female 52.4% vs male 80.9% → significant untapped labour potential','Empowerment channels: education for girls → higher human capital → higher productivity → higher incomes','Micro-credit for women: enables female entrepreneurship → income generation → reduces poverty','Women in parliament (9.2%): greater representation → policies better address female needs (healthcare, childcare)','Economic growth: increasing female labour force participation could significantly boost GDP','Multiplier on families: educated women invest more in children\'s health and education → virtuous cycle across generations','Discuss limitations: cultural barriers, social norms may resist change; lack of infrastructure (schools, childcare)','Evaluation: gender equality is not just morally important but economically strategic; closing gender gaps boosts development across all HDI dimensions']},

{cat:'dev',diff:'hard',marks:8,type:'Evaluate',src:'N19 · P2 Q4d',
 q:'Using information from the text and your knowledge of economics, evaluate the view that Nepal should encourage foreign direct investment (FDI) in order to achieve economic development.',
 tags:['FDI','Nepal','economic development','capital','technology transfer','ODA','infrastructure'],
 hints:['Nepal post-earthquake: bridges, roads, infrastructure damaged → production possibilities constrained','FDI benefits: brings capital (bypasses low domestic savings); technology transfer; management skills; employment creation','Increases productive capacity → PPC shifts outward → higher potential output','FDI in tourism, manufacturing, energy → diversification beyond subsistence agriculture','BUT: FDI may create dependency; profit repatriation → leakages from circular flow','FDI attracted to stable governance, good infrastructure, educated workforce — Nepal may struggle to offer these post-earthquake','Alternatives to FDI: ODA (grants with no repatriation); domestic savings mobilisation; remittances (significant for Nepal)','Evaluate: FDI is one important tool but not sufficient alone; Nepal needs infrastructure, governance reform, education to make FDI beneficial; ODA may be more appropriate given post-disaster context']},

{cat:'exr',diff:'hard',marks:8,type:'Discuss',src:'N20 · P2 Q1d',
 q:'Using information from the text and data, discuss the view that Argentina should keep its floating exchange rate system.',
 tags:['floating exchange rate','Argentina','peso','IMF','current account','inflation'],
 hints:['Arguments FOR floating: automatic stabiliser — depreciation makes exports cheaper → improves trade balance → reduces current account deficit','Floating allows monetary policy independence → central bank can set rates for domestic needs (not just to defend rate)','IMF explicitly supports floating rate; "exchange rate should continue to be determined by market forces"','Helped narrow current account deficit as peso float allowed → from >5% GDP to lower','Arguments AGAINST floating: peso depreciation → imported oil prices rise → higher inflation (already 50%)','High volatility → uncertainty → discourages investment; falling real incomes → recession risk','Argentina\'s persistent inflation suggests peso expected to depreciate continuously → capital flight','Alternatives: managed float (use reserves to reduce volatility); currency board or dollarisation to restore credibility','Evaluate: floating is theoretically appropriate but Argentina\'s institutional credibility problem makes depreciation spiral self-fulfilling; IMF loan + fiscal adjustment needed alongside floating rate']},

{cat:'trade',diff:'hard',marks:8,type:'Discuss',src:'N20 · P2 Q2d',

 tags:['trade protection','US-China','tariff','trade war','WTO','protectionism'],

const CONTEXTS = {
  'M19-Q1': 'United States (US) tin can manufacturers seek tariff exemption on tinplate steel\nThe Can Manufacturers Institute (CMI) has asked the US Department of Commerce to\ntake away tariffs and other trade protection measures that are currently applied to imports\nof tinplate steel. Tinplate steel is used to make tin cans as packaging for food. The CMI\nrepresents the tin can manufacturing industry and its suppliers in the US.\nThe tin can manufacturing industry accounts for the annual domestic production of\napproximately 124 billion tin cans. The industry employs more than 28 000 people, with\nfactories in 33 US states, Puerto Rico and American Samoa. It generates revenue of around\nUS$17.8 billion. The CMI claims that the tariff on imports of tinplate steel has a severe\neconomic impact on the tin can manufacturing industry.\nApproximately 2 % of all US steel is tinplate. Currently, there is excess demand that is\ncausing a disequilibrium in the domestic US tinplate steel market. In 2016, US demand for\ntinplate steel was 2.1 million tons, while domestic supply was 1.2 million tons, meaning that\nonly 57 % of domestic demand was met by US tinplate steel producers. Not only is there a\ndomestic shortage of tinplate steel, but also the CMI claims that there has been a noticeable\ndecline in the quality of domestically-produced tinplate steel.\nThe CMI claims that even a small increase in the price of raw materials could create a\ncompetitive disadvantage, forcing some tin can manufacturing plants to shut down. This\nwould create structural unemployment for 10 000 workers in regionally-based factories.\nThe CMI also claims that the tariff puts food can producers at a competitive disadvantage\nwith other food packaging substitutes, such as plastic and glass. These substitutes are not\nsubject to tariffs.\nAccording to the CMI, canned fruits and vegetables cost 20 % less than fresh food. Because\nof this, people on low incomes consume canned foods at a higher rate than the average\nAmerican. Canned food offers a low-cost solution to feeding the nation; especially the 42\nmillion Americans who live in low-income households. The figure includes 13 million children.\nThe CMI further claims that tariffs, or any trade barriers, have harsh consequences for those\nliving in relative poverty.',
  'M19-Q2': 'The original article about India\'s rupee appreciation has been removed from this paper for copyright reasons.',
  'M19-Q3': 'Bhutan\'s growth soars amid hydropower building boom\nBhutan is a developing Asian country, bordered by India and China. The government\nof Bhutan is mostly interventionist in its approach to economic growth and economic\ndevelopment. Situated in the Himalayan mountains, Bhutan has significant water resources\nthat may be employed to generate hydropower.\nThe most significant intervention by the government is investment in the generation of\nhydropower. However, funding is not possible domestically. The hydropower projects are\nmostly financed by concessional long-term loans from India. Government borrowing to\nfinance hydropower construction has made Bhutan the second-most indebted nation in\nAsia. Bhutan now has a high level of government debt, equal to 118 % of annual real gross\ndomestic product (GDP).\nThe funding of Bhutan\'s interventionist policies has created significant dependence on Indian\ntied aid. A condition of the aid is that Indian companies lead the infrastructure projects. The\nlarge amount of foreign aid has made achieving self-reliance difficult. At present, India\nfinances nearly one-quarter of the Bhutan government\'s budget expenditures.\nWhen the projects are completed they will more than double Bhutan\'s hydropower generation\ncapacity and over 80 % of the power generated will be exported to India. Hydropower to\nIndia is Bhutan\'s largest export, and the increased exports will lead to greater government\nrevenue. Real GDP growth is expected to reach 11.7 % by 2019.\nAnother significant intervention by the government is the promotion of university education for\nas many young people as possible, coupled with the creation of government jobs to employ\nthem. The present level of exporting hydropower to India has provided some government\nrevenue to pay for government jobs. However, while the number of university graduates is\ngrowing each year, the number of government jobs has not been growing at the same rate.\nIn response to the current inability to provide enough jobs, the government is also\nimplementing other programmes. Firstly, they are encouraging graduates to pursue\nemployment in Bhutan\'s small private sector, which is struggling to make a meaningful\ncontribution to economic growth. Secondly, the government is promoting tourism, making it\none of the most popular alternatives to government employment. Thirdly, the government is\nattempting to reduce red tape (excessive regulations) in areas such as industrial licensing,\ntrade, labour markets and finance. This red tape is a barrier to foreign direct investment.\nFinally, the government is trying to make employment in agriculture more appealing. Bhutan\'s\nclimate means that it could be well-positioned to produce and export a variety of fruits.',
  'M19-Q4': 'Chinese investment helps Peru to develop\nOver the past decade, Peru has been one of South America\'s fastest-growing economies,\nwith an average economic growth rate of 5.9 % and low average annual inflation of 2.9 %.\nThis has been mostly due to a favourable external environment, sensible macroeconomic\npolicies and reforms of environmental regulations designed to increase investment in Peru\'s\nprofitable mining sector. However, the deregulation in the mining sector has been opposed\nby environmental groups and trade unions, fearing increased pollution and poorer working\nconditions.\nStrong growth in employment and income has dramatically reduced poverty rates.\nAbsolute poverty fell from 27.6 % in 2005 to 9 % in 2015.\nGross domestic product (GDP) growth continued to accelerate in 2016, very much helped\nby higher mining export output as several new large mining projects entered into production\nand reached full capacity. Peru mines and exports many commodities, including copper, gold,\nlead, zinc, tin, iron ore, silver, and oil and petroleum products.\nChina is Peru\'s main trading partner, taking 22.1 % of Peru\'s exports and supplying 22.7 %\nof their imports in 2016. Chinese companies are also significant suppliers of foreign direct\ninvestment (FDI) to Peru, recently investing over US$2 billion to purchase a hydroelectric\npower plant. The second main trading partner is the United States (US), taking 15.2 % of\nPeru\'s exports and supplying 20.7 % of their imports in 2016.\nPeru\'s current account deficit declined significantly from 4.9 % to 2.8 % of GDP in 2016,\nowing to increasing export growth and lower imports. Peru\'s government continues to\nsupport a free trade policy; since 2006, Peru has signed trade deals with 17 different\ncountries including the US, Canada, China and Japan. In addition, a trade deal has also\nbeen signed with the European Union.\nReal GDP growth is expected to slow slightly in 2017 due to an anticipated lower growth\nrate in the mining sector and weak private investment. To support the economy as mining\nproduction slows, the government is expected to increase public investment in 2017.\nGrowth projections may not be achieved if any, or a combination, of the following occur:\nexternal shocks in commodities prices, a further deceleration of China\'s economic growth,\nunpredictability in world capital markets and the threat of tight monetary policy in the US.\nRaising economic growth requires structural and fiscal reforms to improve productivity,\nreduce the size of the informal sector and improve the efficiency of public services.',
  'N19-Q1': 'Japan\'European Union Economic Partnership Agreement (JEEPA)\nIn July 2017, the Japan\'European Union Economic Partnership Agreement (JEEPA) was\nannounced and it may come into force in 2019. Jointly, Japan and the European Union (EU)\ncurrently account for 28 % of global gross domestic product (GDP). The trade agreement\ncould raise the EU\'s exports to Japan by 34 % and Japan\'s exports to the EU by 29 %.\nEconomists say that this trade agreement marks a determined effort to combat rising\nprotectionism and sends a powerful signal that cooperation, not trade protection, is the way\nto tackle global challenges.\nThe largest benefit to Japan will be for Japanese car manufacturers, as Europe will gradually\nlower tariffs from 10 % on Japanese cars. Car tariffs are a big concern for Japanese car\nmanufacturers, who struggle to compete with South Korean car manufacturers. South\nKorean cars are sold to the EU tariff-free thanks to a free trade agreement signed in 2011.\nWithin Europe, car manufacturers are one of the largest sources of jobs. Car manufacturers\nin the EU are concerned that cutting tariffs on car imports from Japan may lead to a large\nincrease of Japanese cars into the European market.\nThe trade agreement will also resolve non-tariff barriers, such as technical requirements and\nregulations. More importantly, however, the EU and Japan will make their environmental and\nsafety standards on cars the same, which will make trade easier.\nJapanese politicians have been defending their relatively inefficient farmers for a long\ntime. Now, Japan will lower tariffs on European meat, dairy products and wine, cutting\n85  % of the tariffs on food products coming into Japan. This includes removing the current\n30  % tariff on some European cheeses, such as cheddar and gouda cheese. However,\nimported camembert cheese will face a quota. This may be because Japan produces some\ncamembert cheese.\nJEEPA is particularly alarming for United States (US) beef and pork farmers because Japan\nhas been the biggest export market for US beef and the second biggest export market for US\npork. Any preferential tariff that EU farmers receive will make it much tougher for American\nfarmers to sell meat in Japan.\nWith this trade agreement, the EU and Japan are trying to promote the values of economic\ncooperation and environmental conservation, which are both important for long-term\neconomic growth and sustainability. However, JEEPA faces significant challenges because\nit will have to be passed by the Japanese Parliament, the European Parliament and\nEuropean national governments. There is no guarantee that all governments will agree to the\neconomic partnership.',
  'N19-Q2': 'Bank of Canada raises interest rates for the first time in seven years\nFor seven years Canada\'s central bank, the Bank of Canada, kept its official interest rate at\n0.5   %. This period of easy monetary policy may be coming to an end. The Bank of Canada\nhas just raised its official interest rate from 0.5 % to 0.75 %, claiming that there is new\nconfidence in the Canadian economy. Figures show that the 3.5 % growth in gross domestic\nproduct (GDP) in the first quarter of 2017 is above its potential. In addition, the Bank of\nCanada expects growth in consumer spending, exports and business investment to stimulate\neconomic growth in the months ahead. Such factors might contribute to inflationary pressure\nin the future.\nOne of the issues that might have delayed the interest rate increase in Canada is that the\ninflation rate is still low and falling. Central banks typically raise interest rates when inflation\nis rising. That is not the problem in Canada, where the consumer price index (CPI) has been\nrising at well below the Bank of Canada\'s 2 % inflation target. However, the governor of the\nBank of Canada says that he is looking at forecasts of future inflation rates, noting that the\ndata suggest the interest rate increase is necessary. An official statement from the Bank\nof Canada notes that growth is increasing across all industries and regions and that the\neconomy has started to improve. There is no longer a need for the low interest rate.\nPositive economic growth figures, the optimism shown by the Bank of Canada, and the\nrecent interest rate increase have caused a rapid appreciation of the Canadian dollar against\nthe United States (US) dollar over recent months. There are now expectations that the Bank\nof Canada will raise the interest rate once or possibly twice more before the end of the year,\nas signs continue to point to a healthy economy. This would likely cause further strengthening\nof the Canadian dollar against the US dollar.\nAn economist has said that the gain in the Canadian dollar against the US dollar may have\na large effect on importers and exporters, although it will likely be months before consumers\nsee the effects. She further noted that the effects would vary across different industries.\nThere is some concern about the consequences for the Canadian current account. Currently\nthe current account deficit is at 3.6 % of GDP.\nA stronger currency is also likely to encourage more Canadians to travel south to the US.',
  'N19-Q3': 'The original article about women in Cote d\'Ivoire has been removed for copyright reasons. Key data: Female GNI/capita (PPP) = $2,136 vs Male $4,155. Female mean schooling = 3.9 vs 6.1 years. Female HDI = 0.421 vs Male 0.517. Female labour force participation = 52.4% vs Male 80.9%. Women in parliament = 9.2%. Minimum price for cocoa set by government.',
  'N19-Q4': 'The original article about Nepal infrastructure has been removed for copyright reasons. Key context: Nepal earthquake 2015 caused significant infrastructure damage. ODA used for reconstruction of bridges and roads. Nepal seeking FDI. Export revenues from tourism contribute to national income. Nepal is a low-income developing country.',
  'N20-Q1': 'Argentina\'s currency keeps falling\nThe year 2018 started badly for Argentina when the worst drought in 50 years negatively\naffected its export revenues from maize and soybeans, both important exports. The economy\nsuffered several additional problems: a stronger United States dollar (US$), international\ninvestors selling Argentinian assets due to a lack of confidence in the economy, rising inflation\nfrom 25 % to nearly 50 % (Figure 1) and a significant depreciation of the peso, Argentina\'s\ncurrency (Figure 2).\nWhen Argentina\'s president was elected in 2015, inflation was at 25 %. He gave the central\nbank freedom to raise interest rates, which encouraged foreign investors to buy government\nbonds. The government had borrowed a lot of money from overseas to finance the persistent\nbudget deficit, but by 2018, foreign investors were interested in other markets.\nAs the peso was overvalued in 2015, it kept demand for imports high and made it\nhard for exports to compete. The current account deficit rose to more than 5 % of\ngross domestic product (GDP) but slowly narrowed in 2018, because the president allowed\nthe peso to float freely.\nIn May 2018, in an attempt to control the inflation rate and stop the fall in the peso\'s value,\nthe Argentinian central bank raised interest rates to 40 %. In addition, it started selling foreign\ncurrency reserves. However, there were concerns that if the selling of foreign currency reserves\ncontinued, they would be depleted quickly. To address this concern, the president negotiated\na US$50 billion loan from the International Monetary Fund (IMF). Yet the peso continued to\nfall. The IMF loan means that most of Argentina\'s debt-servicing requirements are covered\nuntil 2020. However, under IMF loan conditions, the budget deficit must be cut by postponing\ninfrastructure projects, subsidies must be cut, and government jobs must be cut.\nA spokesperson from the IMF said \'Argentina has a floating, market-determined exchange\nrate, and the IMF fully supports that. The exchange rate should continue to be determined by\nmarket forces.\'\nThe peso\'s weakness causes imported oil prices to go up, further raising inflation. The falling\nreal incomes of households combined with higher interest rates will affect the economy\nnegatively, possibly leading to a recession. Interest rates will remain high for some time,\ndiscouraging investment. Economists expect Argentina to fall into recession, for the fifth time in\na decade.',
  'N20-Q2': 'Unwanted consequences of United States\'China trade war\nIn order to reduce its trade deficit, the United States (US) announced tariffs of 25 % on imports\nof steel and 10 % on imports of aluminium from various countries in March 2018. The US\ngovernment also accused China of unfair trade practices and wants China to import more\nAmerican-made products.\nIn July 2018, the first tariff on Chinese imports took effect and the Chinese government\nretaliated with a ban on US soybeans. In response, the US threatened to impose additional\ntariffs on imports worth almost US$300 billion, including a 25 % tariff on cars and car parts.\nThis would be very damaging to the Chinese economy, which is slowing down, and workers in\nsome provinces have become unemployed.\nThe trade war has also caused anxiety in the European Union and Australia, which are likely\nto see their trade with China affected. Global trade in goods has been slowing, with exports\nfrom trade-dependent nations (such as Japan and South Korea) to China declining. Economists\nhave estimated that other countries could see exports to China drop by as much as 20 %. As of\nearly 2019, Germany\'s economy is almost in recession, partly because of the slowing Chinese\neconomy. If the US imposes its threatened car tariffs, a recession in Germany is inevitable.\nIn the US, concerns were raised that the trade war has reduced business confidence. The\ndecrease in demand from China, which results partly from trade tensions, has hurt the profits\nof US companies such as Apple Inc. and Caterpillar Inc. On the other hand, consumers and\nproducers in the US are switching to domestically-produced goods due to the higher prices of\nsome imported products from China.\nIn an attempt to reduce the risk of a sharp economic slowdown, China\'s central bank eased\nmonetary policy. Economic data showed that small- and medium-sized manufacturing\ncompanies saw the largest negative impact from the slowdown of its economy. Therefore, the\ngovernment changed the definition of a \'small business\', allowing more firms to have access to\nsubsidized lending by state-owned commercial banks.\nAs the impacts of tax cuts enacted in the US in 2017 are disappearing, the US government is\nbecoming more aware that the US economy is hurt by the trade war and is heading towards\nslower growth.',
  'N20-Q3': 'Pakistan and the International Monetary Fund\nPakistan is a low-income country with a rapidly growing population and widespread poverty.\nAs of 2019, it has a large budget deficit due to high levels of military spending and high costs\nof debt servicing (35 % of the deficit is interest payments). It is also experiencing a widening\ncurrent account deficit and is heavily dependent on foreign aid.\nPakistan\'s government is negotiating a loan from the International Monetary Fund (IMF).\nAmongst its conditions, the IMF has said that the government must decrease private-sector\nregulation such as regulations on financial institutions. The government must also sell state-\nowned enterprises and government revenue must be raised by increasing indirect taxes and\nimproving tax collection systems. Furthermore, the IMF insists that the government cuts its\nspending further.\nThe government has stated that the IMF loan is essential to restore confidence in Pakistan\'s\neconomy. This would help to attract foreign direct investment (FDI) to encourage economic\ngrowth and help break out of the poverty cycle. High debt levels and slowing economic growth\nin 2018 discouraged FDI. The IMF loan is also needed to help persuade other multilateral\nlenders such as the World Bank and the Asian Development Bank to provide and extend loans.\nIn the past, Pakistan has had 21 agreements with the IMF with limited success\'any balance\nof payments or external debt improvement has been temporary. The IMF states that this is\nbecause Pakistan has not always met the conditions of the loans, while other stakeholders\nargue it was the lack of support given to Pakistan to implement the conditions and to allocate\nthe loan funds appropriately.\nEconomists say that there needs to be a focus on improving human capital to provide the large\nnumber of young people entering the labour force with the skills to grow businesses. The quality\nof education needs to improve and to be combined with an effort to provide girls with greater\naccess to education\'female participation in the labour force is the lowest in the region.\nThe World Bank has financed education and infrastructure, such as renewable energy\nprojects, in poor regions of Pakistan. However, critics of the World Bank argue that the projects\nare not making a significant difference and the construction of hydroelectric dams leads to\nenvironmental damage.\nThe government believes that the macroeconomic concerns of the IMF should be addressed\nfirst, and poverty issues in Pakistan can be dealt with later.',
  'N21-Q1': 'China and global trade\n1 On 15 January 2020, the United States (US) and China signed a deal that reduced some tariffs\nand required China to buy more from US producers. This was a first step towards resolving\na trade war, which had reduced bilateral trade flows by 9 % and investment flows by 60 %.\nHowever, critics argued that the deal left most tariffs unchanged and did not deal with\ndeeper disagreements.\n2 The US, the European Union (EU) and Japan are calling for tougher World Trade Organization\n(WTO) rules on government support for firms that manufacture items such as steel or solar\npanels. The support, which is often in the form of subsidies, has allegedly undermined\ncompeting firms overseas, either by promoting exports or by decreasing imports, and therefore\ndistorted global trade. Other governments also give subsidies, but there are claims that China\nuses them more extensively.\n3 The proposed WTO rule change would require governments to prove that subsidies do not give\ndomestic firms an unfair advantage over foreign firms and that they do not lead to excess supply\nin the global market. If the rules are implemented, the WTO may regain some of the authority\nthat it has lost in recent years.\n4 One of the US government\'s goals when imposing huge tariffs on Chinese-made goods was\nto bring back manufacturing jobs to the US. Therefore, despite the new deal, the 25 % tariff on\nChinese-made furniture will stay. As a result, many US furniture firms that had used overseas\nfactories to make their US company-branded products have reduced their imports of\nChinese-made furniture.\n5 Meanwhile, Vietnam, Cambodia and Bangladesh are benefitting because US manufacturers of\nwood furniture are setting up factories there. Therefore, some other US producers are asking\nfor the tariff on Chinese-made wooden furniture to apply to all wooden furniture imported into\nthe US, regardless of where it is manufactured.\n6 China is becoming less dominant as an exporter and more integrated into the global trading\nsystem. Its current account surplus was over 10 % of gross domestic product (GDP) in 2007,\nbut it declined to just 0.4 % in 2018. Chinese producers are increasingly buying raw materials\nand other inputs from overseas producers. Although most electronic devices sold in the US\nare assembled in China, Chinese firms are often dependent on foreign suppliers. If the US and\nChina tried to be less interdependent, it would take more than 10 years for China to become\nself-sufficient in the production of computer semiconductors and for the US to shift to other\nsuppliers of electronic devices.',
  'N21-Q2': 'South Korea\'s exchange rate and central bank intervention\n1 From mid-2017 until mid-2019, there was a downward trend in the exchange rate of the South\nKorean won (South Korea\'s currency), and some commentators suggested that it was being\ndeliberately undervalued. Despite the lower exchange rate, however, the value of South Korean\nexports declined by 10.3 % during 2019.\n2 The main reason for the decline in the value of exports was the weak market for semiconductors.\nLower global prices of semiconductors, the largest single export item for South Korea, led to\na drop of 25.9 % in the value of exports, despite an increase in their volume. Evidently, price\ncompetitiveness of exports from South Korea is not as significant as before, because its exports\nare now mainly luxury or high-technology items.\n3 In November 2019, South Korea\'s current account surplus reached US$5.97 billion, more than\n4  % of gross domestic product (GDP). The financial account in the balance of payments had\na net outflow of US$5.34 billion, which was mainly due to a net outflow of US$4.01 billion in\nforeign direct investment (FDI). There was also a net outflow of US$1.07 billion in portfolio\ninvestment, because domestic residents increased their financial assets overseas while inward\nflows declined.\n4 The Bank of Korea (South Korea\'s central bank, BoK) had reduced interest rates to record lows\nin October 2019, which partly accounted for the large portfolio investment outflows. Monetary\npolicy is likely to continue to be expansionary through 2020, with the possibility of another\ninterest rate reduction, because economic growth is forecast to be low, at less than 2.5 %. The\nforecast for inflation is that it will be below 1.5 %, while the unemployment rate is expected to\ncontinue to rise to over 4 %.\n5 While the BoK is not targeting a specific level for the exchange rate, it seems determined to\nintervene when the market is unstable. Its actions, however, have contributed to South Korea\nbeing accused by the United States (US) of changing the value of its currency to gain an export\nadvantage. If the US concludes that South Korea has been manipulating its exchange rate\nunfairly, it could impose trade barriers on imports from South Korea.\n6 However, through the last six months of 2019, the South Korean won started to rise against\nthe US dollar (US$). The appreciation was partly due to speculation and expectations of a rise\nin demand for semiconductors. Moreover, in August 2019, the BoK sold US dollars in order\nto prevent the South Korean won from depreciating again. Overall, the central bank\'s foreign\nexchange intervention has been aimed at restraining the South Korean won\'s depreciation or\nstabilizing the market rather than at trying to promote exports.',
  'N21-Q3': 'Coffee production in Honduras\n1 Coffee farmers in Honduras, Central America, are struggling to earn enough revenue to cover\nproduction costs. Some have left their farms and migrated to the United States (US). Many\nremaining families depend on remittances (money sent by a foreign worker to their home\ncountry) from relatives in the US.\n2 The agricultural sector, which employs about 28 % of the labour force in Honduras and accounts\nfor 45 % of gross domestic product (GDP), has always faced difficulties and has had very little\ngovernment support. Fluctuations in international commodity prices are also a problem. The\naverage global price of a 60 kg bag of coffee beans dropped from US$140 in 2017 to US$62 in\n2019, because countries such as Vietnam, Indonesia and Ethiopia increased their exports.\n3 Scientists say that the greatest threat to crops comes from global warming. The World Bank\nhas estimated that over the next 30 years climate change could force around 1.4 million people\nto leave Central America for the US. Meanwhile, global warming is partly blamed on the US\ncontinuing to operate coal-fired power plants, which account for about 30 % of its\nelectricity generation.\n4 Rising temperatures and uncertain weather have affected plant growth, ruined harvests and\nled to pests and diseases. The amount of land suitable for growing coffee, which is Honduras\'s\nmost important agricultural export, will probably fall by over 40 % before 2050. Already, the\nnumber of coffee producers has declined by 25 % in some areas. Furthermore, reduced yields\nof subsistence crops like corn and beans could significantly increase malnutrition.\n5 Foreign aid from the US includes humanitarian aid and grants to non-governmental\norganizations (NGOs) that have projects helping farmers adapt to climate change. However,\nthe US administration has threatened to stop all foreign aid to Central America, claiming that\nits governments are failing to reduce the flow of migrants to the US. Between 2016 and 2019,\nthe total annual aid budget for Central America had already dropped from US$750 million\nto US$530 million. The biggest reductions were in projects assisting rural economies and\nagriculture, while there was a small increase in funds for drug control and border enforcement,\nin order to reduce the number of migrants to the US.\n6 There is concern among local coffee growers that if aid is stopped there will be more\nunemployment, leading to more migration and abandoned farms.\n7 NGOs are helping coffee farmers to cope better with droughts and to diversify into other crops,\nsuch as avocados or timber. Global coffee sellers, including Starbucks, are supporting some\nprojects in the hope that they can ensure the future supply of coffee. However, coffee farming in\nHonduras may never be profitable again.',
  'N21-Q4': 'Infrastructure projects in Tanzania\n1 In 2018, Tanzania\'s gross domestic product (GDP) grew by 7 %. But the trade balance\ndeteriorated, with exports declining and imports increasing. Moreover, limits on government\ncurrent expenditure and lower levels of inward foreign direct investment (FDI) suggest that GDP\ngrowth will weaken to 5 % in 2019. Inflation will stay low through 2019, due to lower prices for\nfood and raw materials.\n2 The government has promised reforms to improve the business environment and fiscal\nmanagement. However, the budget deficit is forecast to increase from 2.3 % of GDP to 4 % of\nGDP by 2020.\n3 Government investment in large-scale projects, such as the construction of railway lines, dams\nfor electricity generation, bridges, roads and airports, could lead to annual economic growth\nof 10 %. These projects, however, are financed mainly by loans from commercial banks with\na short repayment period and high interest rates. Therefore, the national debt and the cost\nof debt servicing are increasing. The national debt has risen from US$22 billion in 2015 to\nUS$28.6 billion in 2019.\n4 The Minister for Finance and Planning is optimistic that the debt is sustainable. \'The debt\nassessment shows we can continue to borrow locally and abroad to finance development\nactivities and pay off matured loans using our internal and external revenue,\' he said. According\nto the central bank, the transport and telecommunication sectors received a greater share of\nthe funding, accounting for 26.8 % of the debt, followed by social welfare, education, energy\nand mining.\n5 All the large infrastructure projects use some materials imported from abroad, such as steel.\nTherefore, the current account deficit will widen further due to increased imports of resources\nnecessary for production. The government\'s ability to use its expenditure to stimulate domestic\nproduction will be reduced, because funds are being sent overseas to external lenders and\nconstruction firms.\n6 Tanzania is undergoing a structural change with a higher proportion of the labour force working\nin the manufacturing and service sectors, while agriculture is employing fewer workers. Despite\na reduction in the poverty rate, the absolute number of poor people is still high due to population\ngrowth. According to a World Bank report, almost half the population lives on less than US$1.90\nper person per day. It concludes that the poor have benefited relatively less from recent\neconomic growth, resulting in an increase in income inequality from 2015 to 2019.\n7 Further investments in human capital, targeted towards the poor, are needed to increase\naccess to higher-skilled jobs. However, government efforts to expand public services, including\neducation, health, and sanitation and clean water facilities, have been undermined by their\ndeclining quality as the population rises faster than the supply of the services. Therefore, the\nlevels of education and basic services remain low, particularly for the poorest and those living in\nrural areas.',
};

/* ── CONTEXT KEY HELPER ── */
function getCtxKey(src) {
  var m = src.match(/(M\d+|N\d+)[^P]*P2 Q(\d+)/);
  return m ? m[1]+'-Q'+m[2] : null;
}


/* ══════════════════════════════════ STATE ══════════════════════════════════ */
let activeCategory = 'all', activeDiff = 'all', searchQuery = '', activeGroup = 'all';
const DLABEL = { easy:'Easy', medium:'Medium', hard:'Hard', vhard:'Very Hard' };

/* ══════════════════════════════════ STATS ══════════════════════════════════ */
function renderStats() {
  const c = {easy:0,medium:0,hard:0,vhard:0};
  questions.forEach(q=>c[q.diff]++);
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-pill all"><span class="dot" style="background:var(--muted)"></span>${questions.length} total</div>
    <div class="stat-pill e"><span class="dot"></span>${c.easy} Easy</div>
    <div class="stat-pill m"><span class="dot"></span>${c.medium} Medium</div>
    <div class="stat-pill h"><span class="dot"></span>${c.hard} Hard</div>
    <div class="stat-pill v"><span class="dot"></span>${c.vhard} V.Hard</div>`;
}

/* ══════════════════════════════════ NAV ══════════════════════════════════ */
function renderGroupNav() {
  const groups = [
    {id:'all',label:'All Subjects'},
    {id:'micro',label:'Microeconomics'},
    {id:'macro',label:'Macroeconomics'},
  ];
  document.getElementById('groupNav').innerHTML = groups.map(g=>`
    <button class="group-tab${g.id===activeGroup?' active':''}" onclick="setGroup('${g.id}',this)">${g.label}</button>`
  ).join('');
}

function renderCatNav() {
  const filtered = activeGroup==='all' ? categories :
                   categories.filter(c=>c.section===activeGroup);
  const allBtn = `<button class="cat-tab${activeCategory==='all'?' active':''}" onclick="setCategory('all',this)">All</button>`;
  const catBtns = filtered.map(c=>`
    <button class="cat-tab${c.id===activeCategory?' active':''}" onclick="setCategory('${c.id}',this)">
      ${c.icon?c.icon+' ':''}${c.label}
    </button>`).join('');
  document.getElementById('catNav').innerHTML = allBtn + catBtns;
}

function setGroup(id, el) {
  activeGroup = id;
  // if current activeCategory doesn't exist in new group, reset to all
  if (activeCategory !== 'all') {
    const found = categories.find(c=>c.id===activeCategory && (id==='all'||c.section===id));
    if (!found) activeCategory = 'all';
  }
  document.querySelectorAll('.group-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderCatNav();
  renderMain();
}

/* ══════════════════════════════════ RENDER ══════════════════════════════════ */
function card(q, idx) {
  const isP2 = q.src.includes('P2');
  const ctxKey = isP2 ? getCtxKey(q.src) : null;
  const ctxText = ctxKey ? CONTEXTS[ctxKey] : null;
  const msKey = q.src;
  const msItems = MS[msKey] || null;

  // Context section (P2 only)
  let ctxSection = '';
  if (isP2) {
    if (ctxText) {
      const isRemoved = ctxText.includes('removed') || ctxText.length < 300;
      ctxSection = `
      <div class="coll-wrap">
        <button class="coll-btn ctx-btn" onclick="toggleColl(this)">
          <span>📄 Source Text / Extract</span><span class="coll-arrow">▼</span>
        </button>
        <div class="coll-body">
          <div class="${isRemoved ? 'ctx-removed' : 'ctx-body'}">${ctxText.replace(/\\n/g,'\n')}</div>
        </div>
      </div>`;
    } else {
      ctxSection = `
      <div class="coll-wrap">
        <button class="coll-btn ctx-btn" onclick="toggleColl(this)">
          <span>📄 Source Text / Extract</span><span class="coll-arrow">▼</span>
        </button>
        <div class="coll-body">
          <div class="ctx-removed">Source text for this question session is not available in the uploaded documents.</div>
        </div>
      </div>`;
    }
  }

  // Official MS section
  let msSection = '';
  if (msItems) {
    msSection = `
    <div class="coll-wrap">
      <button class="coll-btn ms-btn" onclick="toggleColl(this)">
        <span>📋 Official Mark Scheme</span><span class="coll-arrow">▼</span>
      </button>
      <div class="coll-body">
        <div class="ms-body">
          ${msItems.map(b=>`<div class="ms-item"><span class="ms-bullet">›</span><span>${b}</span></div>`).join('')}
        </div>
      </div>
    </div>`;
  } else {
    msSection = `
    <div class="coll-wrap">
      <button class="coll-btn ms-btn" onclick="toggleColl(this)">
        <span>📋 Official Mark Scheme</span><span class="coll-arrow">▼</span>
      </button>
      <div class="coll-body">
        <div class="ms-body"><p class="ms-na">Mark scheme not available for this question in the uploaded documents.</p></div>
      </div>
    </div>`;
  }

  return `
  <div class="qcard ${q.diff}" id="qc${idx}" data-diff="${q.diff}" data-cat="${q.cat}">
    <div class="qbody">
      <div class="qmeta">
        <span class="badge src">${q.src}</span>
        <span class="badge pts">${q.marks} marks</span>
        <span class="badge diff ${q.diff}">${DLABEL[q.diff]}</span>
        <span class="badge type">${q.type}</span>
      </div>
      ${ctxSection}
      <div class="qtext">${q.q}</div>
      <div class="qtags">${q.tags.map(t=>`<span class="qtag">${t}</span>`).join('')}</div>
      <div class="coll-wrap">
        <button class="coll-btn hints-btn-new" onclick="toggleColl(this)">
          <span>📌 Mark Scheme Hints</span><span class="coll-arrow">▼</span>
        </button>
        <div class="coll-body">
          <div class="hints-body open">
            ${q.hints.map(h=>`<div class="hint"><span class="hbullet">›</span><span>${h}</span></div>`).join('')}
          </div>
        </div>
      </div>
      ${msSection}
    </div>
  </div>`;
}

function catSection(cat) {
  const qs = questions.filter(q=>q.cat===cat.id);
  return `
  <div class="cat-section" id="sec-${cat.id}">
    <div class="cat-head">
      <div class="cat-icon">${cat.icon}</div>
      <div class="cat-title">${cat.label}</div>
      <div class="cat-cnt">${qs.length} question${qs.length!==1?'s':''}</div>
    </div>
    <div class="qgrid">${qs.map(q=>card(q,questions.indexOf(q))).join('')}</div>
  </div>`;
}

function renderMain() {
  const micro = categories.filter(c=>c.section==='micro');
  const macro = categories.filter(c=>c.section==='macro');
  const showAll = activeCategory==='all';
  let html = '';
  if(showAll) html += `<div class="section-label"><span>⬡ Microeconomics</span></div>`;
  micro.forEach(cat=>{ if(showAll||activeCategory===cat.id) html+=catSection(cat); });
  if(showAll) html += `<div class="section-label"><span>⬡ Macroeconomics</span></div>`;
  macro.forEach(cat=>{ if(showAll||activeCategory===cat.id) html+=catSection(cat); });
  document.getElementById('mainContent').innerHTML =
    html||`<div class="empty"><h3>No questions found</h3><p>Try a different filter or search term.</p></div>`;
  applyFilters();
}

/* ══════════════════════════════════ FILTERS ══════════════════════════════════ */
function applyFilters() {
  const q = searchQuery.toLowerCase();
  document.querySelectorAll('.qcard').forEach(card=>{
    const ok = (activeDiff==='all'||card.dataset.diff===activeDiff) &&
               (!q||card.innerText.toLowerCase().includes(q));
    card.classList.toggle('hidden',!ok);
  });
  document.querySelectorAll('.cat-section').forEach(sec=>{
    sec.classList.toggle('hidden', sec.querySelectorAll('.qcard:not(.hidden)').length===0);
  });
}
function setCategory(id,el){
  activeCategory=id;
  document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderMain();
}
function setDiff(diff,el){
  activeDiff=diff;
  document.querySelectorAll('.df').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}
function toggleColl(btn){
  const body = btn.nextElementSibling;
  body.classList.toggle('open');
  btn.classList.toggle('open');
}
// Legacy alias
function toggleHints(btn){ toggleColl(btn); }
document.getElementById('searchBox').addEventListener('input',function(){
  searchQuery=this.value; applyFilters();
});

renderStats(); renderGroupNav(); renderCatNav(); renderMain();
</script>
</body>
</html>
