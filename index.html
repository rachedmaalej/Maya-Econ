<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IB Economics SL — Question Bank</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #f5f2ec;
  --surface:   #ffffff;
  --surface2:  #f0ece4;
  --border:    #ddd8ce;
  --text:      #1c1917;
  --muted:     #78716c;
  --accent:    #92600a;
  --accent-lt: #fef3c7;
  --easy:      #166534;
  --easy-bg:   #dcfce7;
  --medium:    #1d4ed8;
  --medium-bg: #dbeafe;
  --hard:      #c2410c;
  --hard-bg:   #ffedd5;
  --vhard:     #b91c1c;
  --vhard-bg:  #fee2e2;
  --shadow:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,.1), 0 2px 4px rgba(0,0,0,.06);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ══════════════════════════════════
   HEADER
══════════════════════════════════ */
header {
  background: #fff;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.header-inner {
  max-width: 1300px;
  margin: 0 auto;
  padding: 1.1rem 2rem 0;
}
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
  gap: 1rem;
  flex-wrap: wrap;
}

.branding { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
.branding h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.45rem;
  color: var(--accent);
  letter-spacing: -.02em;
  line-height: 1;
}
.branding-sep { color: var(--border); }
.branding p {
  color: var(--muted);
  font-size: .72rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  font-weight: 500;
}

.stats-row { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
.stat-pill {
  display: flex; align-items: center; gap: .28rem;
  padding: .2rem .6rem;
  border-radius: 20px;
  font-size: .67rem;
  font-weight: 600;
  letter-spacing: .04em;
  white-space: nowrap;
}
.stat-pill.all { background: var(--surface2); color: var(--muted);   border: 1px solid var(--border); }
.stat-pill.e   { background: var(--easy-bg);   color: var(--easy);   border: 1px solid #bbf7d0; }
.stat-pill.m   { background: var(--medium-bg); color: var(--medium); border: 1px solid #bfdbfe; }
.stat-pill.h   { background: var(--hard-bg);   color: var(--hard);   border: 1px solid #fed7aa; }
.stat-pill.v   { background: var(--vhard-bg);  color: var(--vhard);  border: 1px solid #fecaca; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* Controls */
.controls {
  display: flex;
  gap: .6rem;
  margin-bottom: .8rem;
  flex-wrap: wrap;
  align-items: center;
}
.search {
  flex: 1;
  min-width: 180px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: .46rem .9rem;
  color: var(--text);
  font-size: .84rem;
  font-family: 'Inter', sans-serif;
  transition: border-color .18s, box-shadow .18s;
}
.search:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(146,96,10,.1);
  background: #fff;
}
.search::placeholder { color: var(--muted); }

.diff-filters { display: flex; gap: .3rem; flex-wrap: wrap; }
.df {
  padding: .36rem .8rem;
  border-radius: 20px;
  border: 1.5px solid;
  cursor: pointer;
  font-size: .71rem;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  transition: all .15s;
  letter-spacing: .03em;
  line-height: 1;
}
.df.all-d  { border-color: var(--border); background: transparent; color: var(--muted); }
.df.easy-d { border-color: #86efac;       background: transparent; color: var(--easy); }
.df.med-d  { border-color: #93c5fd;       background: transparent; color: var(--medium); }
.df.hard-d { border-color: #fdba74;       background: transparent; color: var(--hard); }
.df.vh-d   { border-color: #fca5a5;       background: transparent; color: var(--vhard); }
.df.active.all-d  { background: var(--text);   color: #fff; border-color: var(--text); }
.df.active.easy-d { background: var(--easy);   color: #fff; border-color: var(--easy); }
.df.active.med-d  { background: var(--medium); color: #fff; border-color: var(--medium); }
.df.active.hard-d { background: var(--hard);   color: #fff; border-color: var(--hard); }
.df.active.vh-d   { background: var(--vhard);  color: #fff; border-color: var(--vhard); }

/* ── CATEGORY TABS — flex-wrap so they never scroll horizontally ── */
.cat-nav {
  display: flex;
  flex-wrap: wrap;       /* key change: tabs wrap to new rows */
  border-top: 1px solid var(--border);
  margin: 0 -2rem;
  padding: 0 2rem;
  row-gap: 0;
}
.cat-tab {
  padding: .5rem .9rem;
  border: none;
  background: none;
  color: var(--muted);
  cursor: pointer;
  font-size: .72rem;
  font-weight: 500;
  font-family: 'Inter', sans-serif;
  letter-spacing: .03em;
  border-bottom: 3px solid transparent;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
  line-height: 1.2;
}
.cat-tab:hover { color: var(--text); }
.cat-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 600;
}

/* ══════════════════════════════════
   MAIN
══════════════════════════════════ */
main {
  max-width: 1300px;
  margin: 0 auto;
  padding: 2rem;
}

.section-label {
  display: flex;
  align-items: center;
  gap: .9rem;
  margin: 2rem 0 1.25rem;
}
.section-label span {
  font-size: .62rem;
  font-weight: 700;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--accent);
  white-space: nowrap;
  background: var(--accent-lt);
  padding: .24rem .7rem;
  border-radius: 20px;
  border: 1px solid #fde68a;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.cat-section { margin-bottom: 2.5rem; }
.cat-section.hidden { display: none; }

.cat-head {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding-bottom: .75rem;
  margin-bottom: 1.1rem;
  border-bottom: 1.5px solid var(--border);
}
.cat-icon {
  width: 30px; height: 30px;
  border-radius: 7px;
  background: var(--accent-lt);
  border: 1px solid #fde68a;
  display: flex; align-items: center; justify-content: center;
  font-size: .85rem; flex-shrink: 0;
}
.cat-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem;
  color: var(--text);
  font-weight: 600;
}
.cat-cnt {
  margin-left: auto;
  font-size: .67rem;
  color: var(--muted);
  background: var(--surface2);
  padding: .16rem .55rem;
  border-radius: 10px;
  border: 1px solid var(--border);
  font-weight: 500;
}

.qgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 1rem;
}

/* Card */
.qcard {
  background: var(--surface);
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
  transition: transform .18s, box-shadow .18s;
  position: relative;
  box-shadow: var(--shadow);
}
.qcard::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0; width: 4px;
}
.qcard.easy::before   { background: var(--easy); }
.qcard.medium::before { background: var(--medium); }
.qcard.hard::before   { background: var(--hard); }
.qcard.vhard::before  { background: var(--vhard); }
.qcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.qcard.hidden { display: none; }

.qbody { padding: 1.1rem 1.1rem 1.1rem 1.4rem; }

.qmeta { display: flex; gap: .32rem; flex-wrap: wrap; margin-bottom: .72rem; align-items: center; }
.badge {
  padding: .17rem .52rem;
  border-radius: 5px;
  font-size: .65rem;
  font-weight: 600;
  letter-spacing: .03em;
}
.badge.src  { background: var(--surface2); color: var(--muted);  border: 1px solid var(--border); }
.badge.pts  { background: var(--accent-lt); color: var(--accent); border: 1px solid #fde68a; }
.badge.type { background: #ede9fe; color: #6d28d9; border: 1px solid #ddd6fe; }
.badge.diff.easy   { background: var(--easy-bg);   color: var(--easy);   border: 1px solid #bbf7d0; }
.badge.diff.medium { background: var(--medium-bg); color: var(--medium); border: 1px solid #bfdbfe; }
.badge.diff.hard   { background: var(--hard-bg);   color: var(--hard);   border: 1px solid #fed7aa; }
.badge.diff.vhard  { background: var(--vhard-bg);  color: var(--vhard);  border: 1px solid #fecaca; }

.qtext {
  font-size: .875rem;
  line-height: 1.65;
  color: var(--text);
  margin-bottom: .82rem;
}
.qtags { display: flex; flex-wrap: wrap; gap: .28rem; margin-bottom: .82rem; }
.qtag {
  padding: .14rem .48rem;
  border-radius: 4px;
  font-size: .63rem;
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
  font-weight: 500;
}

.hints-btn {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: .46rem .72rem;
  color: var(--muted);
  font-size: .72rem;
  cursor: pointer;
  text-align: left;
  font-family: 'Inter', sans-serif;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background .15s, border-color .15s;
  font-weight: 500;
}
.hints-btn:hover { background: #e9e4dc; border-color: #c9c4bb; color: var(--text); }
.arrow { transition: transform .2s; font-size: .6rem; }
.arrow.open { transform: rotate(180deg); }

.hints-body { display: none; padding-top: .65rem; }
.hints-body.open { display: block; }
.hint {
  display: flex; gap: .48rem;
  padding: .3rem 0;
  font-size: .785rem;
  color: #57534e;
  border-bottom: 1px solid #f0ece4;
  line-height: 1.5;
}
.hint:last-child { border-bottom: none; }
.hbullet { color: var(--accent); font-weight: 700; flex-shrink: 0; margin-top: .05rem; }

.empty { text-align: center; padding: 5rem 2rem; color: var(--muted); }
.empty h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: .5rem; color: var(--text); }
.empty p { font-size: .85rem; }
.hidden { display: none !important; }

@media (max-width: 768px) {
  .header-inner { padding: .85rem 1rem 0; }
  .cat-nav { margin: 0 -1rem; padding: 0 1rem; }
  main { padding: 1.25rem 1rem; }
  .qgrid { grid-template-columns: 1fr; }
  .stats-row { display: none; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-top">
      <div class="branding">
        <h1>IB Economics SL</h1>
        <span class="branding-sep">/</span>
        <p>Question Bank &mdash; Past Papers 2021–2022</p>
      </div>
      <div class="stats-row" id="statsRow"></div>
    </div>

    <div class="controls">
      <input class="search" id="searchBox" type="text" placeholder="🔍  Search questions, topics, or concepts…">
      <div class="diff-filters">
        <button class="df all-d active" onclick="setDiff('all',this)">All</button>
        <button class="df easy-d"       onclick="setDiff('easy',this)">Easy</button>
        <button class="df med-d"        onclick="setDiff('medium',this)">Medium</button>
        <button class="df hard-d"       onclick="setDiff('hard',this)">Hard</button>
        <button class="df vh-d"         onclick="setDiff('vhard',this)">Very Hard</button>
      </div>
    </div>

    <nav class="cat-nav" id="catNav"></nav>
  </div>
</header>

<main id="mainContent"></main>

<script>
const categories = [
  { id:'all',   label:'All Questions',     icon:'📚' },
  { id:'sd',    label:'Supply & Demand',   icon:'🔄', section:'micro' },
  { id:'ela',   label:'Elasticity',        icon:'📊', section:'micro' },
  { id:'pf',    label:'Price Floors',      icon:'⬆️',  section:'micro' },
  { id:'pc',    label:'Price Ceilings',    icon:'⬇️',  section:'micro' },
  { id:'tax',   label:'Taxes & Subsidies', icon:'💰', section:'micro' },
  { id:'ext',   label:'Externalities',     icon:'🌿', section:'micro' },
  { id:'gov',   label:'Gov. Intervention', icon:'🏛️',  section:'micro' },
  { id:'adas',  label:'AD/AS Model',       icon:'📈', section:'macro' },
  { id:'une',   label:'Unemployment',      icon:'👔', section:'macro' },
  { id:'mon',   label:'Monetary Policy',   icon:'🏦', section:'macro' },
  { id:'fis',   label:'Fiscal Policy',     icon:'📋', section:'macro' },
  { id:'ssp',   label:'Supply-Side Pol.',  icon:'⚙️',  section:'macro' },
  { id:'exr',   label:'Exchange Rates',    icon:'💱', section:'macro' },
  { id:'trade', label:'Intl. Trade',       icon:'🌍', section:'macro' },
  { id:'dev',   label:'Growth & Dev.',     icon:'🌱', section:'macro' },
  { id:'pov',   label:'Poverty & Equity',  icon:'⚖️',  section:'macro' },
];

const questions = [
/* ── SUPPLY & DEMAND ── */
{cat:'sd',diff:'easy',marks:4,type:'Explain (Diagram)',src:'N21 · P2 Q3b',
 q:'Using a demand and supply diagram, explain why the global price of coffee beans dropped when countries such as Vietnam, Indonesia and Ethiopia increased their exports.',
 tags:['supply shift','price equilibrium','commodity markets'],
 hints:['Draw D&S diagram for coffee','Show rightward shift of supply curve','Identify new lower equilibrium price','Explain: higher supply → excess supply at old price → price falls']},

{cat:'sd',diff:'easy',marks:4,type:'Explain (Diagram)',src:'N22 · P2 Q1c',
 q:'Using a demand and supply diagram, explain why falling overseas demand will reduce Bangladeshi garment firms\' revenue.',
 tags:['demand shift','revenue','garment industry'],
 hints:['Draw D&S with demand shifting left','Show lower price AND lower quantity','Link both effects to reduced total revenue (P×Q)','Note: TR = P × Q — both fall']},

{cat:'sd',diff:'easy',marks:4,type:'Explain (Diagram)',src:'M22 · P2 Q2f',
 q:'Using a demand and supply diagram, explain how modern farming practices (machinery and fertilizers) could affect the market for rice in Sierra Leone.',
 tags:['supply shift','technology','agriculture'],
 hints:['Improved farming = lower costs / higher yields → supply shifts right','Show new lower equilibrium price and higher quantity','Benefit to consumers: lower price','Producers: depends on PED for revenue effect']},

{cat:'sd',diff:'medium',marks:10,type:'Explain',src:'M21 TZ1 · P1 Q1a',
 q:'Explain how the price mechanism reallocates resources when there is a decrease in the supply of a good.',
 tags:['price mechanism','signals & incentives','market equilibrium','resource allocation'],
 hints:['Define price mechanism, supply, and resource reallocation','Draw diagram: supply shifts left, price rises, quantity falls','Explain: higher price → signal for producers to expand supply, incentive for consumers to switch','Consumers reallocate spending to substitutes','Producers reallocate resources to now more profitable good']},

/* ── ELASTICITY ── */
{cat:'ela',diff:'medium',marks:10,type:'Explain',src:'M21 TZ2 · P1 Q1a',
 q:'Explain why the price elasticity of demand for primary commodities is often relatively low while the price elasticity of demand for manufactured goods is often relatively high.',
 tags:['PED','primary commodities','manufactured goods','substitutes','necessity'],
 hints:['Define price elasticity of demand (PED)','Draw inelastic D curve for commodities; elastic D curve for manufactures','Commodities: few substitutes, often necessities, small share of income → inelastic','Manufactured goods: many substitutes, often luxuries, wider product variety → elastic','Give examples: oil/wheat (inelastic) vs. branded electronics (elastic)']},

{cat:'ela',diff:'medium',marks:10,type:'Explain',src:'N21 · P1 Q1a',
 q:'Explain how a decrease in income might affect the demand for normal goods and the demand for inferior goods.',
 tags:['YED','income elasticity','normal goods','inferior goods','demand shift'],
 hints:['Define normal good (YED > 0) and inferior good (YED < 0)','Show demand shifting LEFT for normal goods when income falls','Show demand shifting RIGHT for inferior goods when income falls','Examples: luxury cars (normal); instant noodles, bus rides (inferior)','Maximum [6] if only one type addressed']},

{cat:'ela',diff:'hard',marks:15,type:'Discuss',src:'M21 TZ2 · P1 Q1b',
 q:'Discuss the importance of price elasticity of demand (PED) and cross price elasticity of demand (XED) for a firm\'s decision making.',
 tags:['PED','XED','total revenue','substitutes','complements','pricing strategy'],
 hints:['Define PED and XED clearly','PED: elastic demand → price cut raises TR; inelastic → price rise raises TR','XED: positive = substitutes (rival pricing matters); negative = complements (bundle pricing)','Real-world: airline pricing, app ecosystems, petrol and cars','Limitations: difficulty estimating PED/XED in practice; ceteris paribus assumption','Consider XED is most useful in oligopolistic markets']},

{cat:'ela',diff:'hard',marks:15,type:'Discuss',src:'N21 · P1 Q1b',
 q:'Discuss the significance of income elasticity of demand (YED) for producers of primary products and producers of manufactured goods when incomes are rising.',
 tags:['YED','primary products','manufactured goods','rising incomes','commodity trap'],
 hints:['Define YED; primary products tend to have low YED (necessities)','Manufactured goods (especially luxuries) have high positive YED','Rising incomes benefit manufacturers disproportionately','Primary producers face slower revenue growth even as economies expand','Discuss: commodities with high YED exist (e.g., organic food); luxury vs. basic manufactures differ','Award max [9] if only one producer type addressed']},

/* ── PRICE FLOORS ── */
{cat:'pf',diff:'medium',marks:10,type:'Explain',src:'N21 · P1 Q2a',
 q:'Explain the impact on consumers, producers and the government of a price floor being introduced in an agricultural market.',
 tags:['price floor','minimum price','surplus','agricultural markets','stakeholders'],
 hints:['Define price floor (must be set above equilibrium)','Draw diagram: price floor above equilibrium, showing surplus (Qs > Qd)','Consumers: pay higher price, buy less → welfare loss','Producers: receive higher price, want to supply more, revenue may rise','Government: must purchase surplus at set price → costly','Award max [6] for one stakeholder; max [8] for two; all three needed for full marks']},

{cat:'pf',diff:'hard',marks:15,type:'Discuss',src:'M21 TZ1 · P1 Q2b',
 q:'Discuss the view that price floors are more effective than subsidies in providing assistance to producers in the agricultural sector.',
 tags:['price floor','subsidies','agricultural support','producer income','policy comparison'],
 hints:['Define price floors and subsidies; draw both diagrams','Price floor: guaranteed higher price, but creates surplus; government must buy surplus','Subsidy: shifts supply right, lowers consumer price too, boosts producer income; no surplus','Price floors may distort market more; subsidies preserve market equilibrium','Consider WTO rules on agricultural subsidies as a real-world constraint','Award max [12] if no explicit comparison of "more effective"']},

/* ── PRICE CEILINGS ── */
{cat:'pc',diff:'hard',marks:15,type:'Evaluate',src:'N21 · P1 Q2b',
 q:'Evaluate the view that a price ceiling is an ineffective policy to protect low-income consumers.',
 tags:['price ceiling','maximum price','shortage','black market','low-income consumers'],
 hints:['Define price ceiling (must be set below equilibrium)','Draw diagram: ceiling below equilibrium → excess demand (shortage)','Negatives: shortage, queuing, black markets, corruption, quality decline','But: some lucky consumers DO get the good at a lower price — clear benefit','Effective IF: government has alternative rationing system (e.g., coupons)','Real-world: rent controls, fuel price caps. Evaluate: who actually benefits?']},

/* ── TAXES & SUBSIDIES ── */
{cat:'tax',diff:'medium',marks:10,type:'Explain',src:'M21 TZ1 · P1 Q2a',
 q:'Explain two reasons why a government might impose indirect taxes.',
 tags:['indirect tax','excise duty','demerit goods','negative externalities','government revenue','VAT'],
 hints:['Define indirect taxes (levied on expenditure, e.g., VAT, excise duty)','Draw diagram: supply shifts left/up, price rises, quantity falls','Reason 1: raise government revenue (e.g., VAT on all goods)','Reason 2: correct negative externalities / discourage demerit goods (e.g., tobacco tax)','Could also mention: trade protection, income redistribution','Award max [6] if only one reason explained']},

{cat:'tax',diff:'hard',marks:15,type:'Evaluate',src:'M22 · P1 Q1b',
 q:'Using real-world examples, evaluate the effects for stakeholders of a government imposing an indirect tax on a particular good.',
 tags:['indirect tax','consumer surplus','producer surplus','tax incidence','PED','PES','deadweight loss'],
 hints:['Draw D&S diagram with supply shifting left; identify new price & quantity','Consumers: pay higher price, buy less, lose consumer surplus','Producers: receive lower price net of tax, sell less, lose revenue','Workers: possible job losses in the taxed industry','Government: gains tax revenue for public spending','Evaluation: tax incidence depends on PED/PES; specific vs. ad valorem; regressive nature if on necessities','Award max [9] if only one stakeholder mentioned']},

/* ── EXTERNALITIES ── */
{cat:'ext',diff:'easy',marks:4,type:'Explain (Diagram)',src:'M22 · P2 Q1d',
 q:'Using an externalities diagram, explain how North Macedonia\'s dependence on coal could be a source of market failure.',
 tags:['negative externality','market failure','MSC','MPC','coal','pollution'],
 hints:['Draw negative externality of production diagram','MPC < MSC (external costs of pollution not borne by producer)','Market produces at Qm (too much) vs. socially optimal Qs (less)','Welfare loss (deadweight loss) triangle shown','Coal burning → air pollution externality → MSC > MPC']},

{cat:'ext',diff:'easy',marks:4,type:'Explain (Diagram)',src:'N21 · P2 Q3c',
 q:'Using an externalities diagram, explain how coal-fired power plants in the US might be causing market failure.',
 tags:['negative externality','coal','pollution','MSC','deadweight loss'],
 hints:['Negative production externality diagram','MSC curve above MPC curve (external cost = pollution/global warming)','Competitive market produces Qm > socially optimal Qs','Deadweight welfare loss triangle','Link: coal plant carbon emissions → global warming → negative third-party effects']},

{cat:'ext',diff:'easy',marks:4,type:'Explain (Diagram)',src:'N22 · P2 Q2c',
 q:'Using an externalities diagram, explain why the government of Uruguay should subsidize health care.',
 tags:['positive externality','MSB','MPB','health care','market failure','subsidy'],
 hints:['Positive consumption externality diagram','MPB < MSB (society gains more than the individual: herd immunity, productivity)','Market under-provides health care at Qm < Qs','Subsidy shifts supply right → reduces price → increases consumption toward Qs','Welfare gain = area of deadweight loss recovered']},

{cat:'ext',diff:'medium',marks:10,type:'Explain',src:'M21 TZ2 · P1 Q2a',
 q:'Explain the concept of positive externalities of consumption.',
 tags:['positive externality','MSB','MPB','market failure','vaccination','education'],
 hints:['Define externalities and positive externalities of consumption','Draw diagram: MPB curve, MSB curve (above MPB), supply = MPC = MSC','Market equilibrium at Qm (too little), socially optimal at Qs','Explain: third-party benefits not reflected in market price','Examples: vaccination (herd immunity), education (skilled workforce externality)','Deadweight welfare loss shown between Qm and Qs']},

{cat:'dev',diff:'vhard',marks:15,type:'Discuss',src:'M22 · P2 Q1g',
 q:'Using information from the texts and data, discuss the likely economic effects on North Macedonia of its entry into the European Union (EU) Common Market.',
 tags:['EU membership','trade creation','trade diversion','FDI','free movement','North Macedonia'],
 hints:['Trade benefits: tariff-free access to EU market → exports grow; 75% exports already to EU','Trade creation vs. trade diversion: removal of barriers with EU may divert from other partners','FDI: EU companies likely to invest more in North Macedonia (cheap labour + inside common market)','BUT: profit repatriation = major concern (foreign profits sent home)','Free movement of labour → emigration risk; brain drain from North Macedonia','Wine/beef/fish quotas removed → domestic producers face EU competition','Financial assistance from EU (€633m for reforms) helps modernisation','Use Table 2: GDP growth positive; unemployment falling; evaluate trajectory']},

{cat:'dev',diff:'vhard',marks:15,type:'Evaluate',src:'N22 · P2 Q2g',
 q:'Using information from the texts and data, evaluate the effectiveness of Uruguay\'s government macroeconomic policies in achieving economic growth and economic development.',
 tags:['macroeconomic policy','Uruguay','HDI','fiscal policy','monetary policy','supply-side','income redistribution'],
 hints:['Fiscal policy: progressive tax (25%→36% top rate); social spending for poor','Monetary policy: central bank aims to reduce inflation below 6%; currently 7.9%','Supply-side: state enterprise efficiency reforms; deregulation of labour market; ICT sector development','Growth data: 7.8% (2010) → 0.22% (2019) — significant slowdown; policy effectiveness questionable','Development: HDI 0.78 → 0.82; Gini 0.45 → 0.40 (less inequality); life expectancy up','Concerns: unemployment rising (7.2% → 9.4%); agricultural vulnerability','Evaluate: development goals better achieved than growth goals']},

{cat:'dev',diff:'vhard',marks:15,type:'Discuss',src:'N22 · P2 Q1g',
 q:'Using information from the texts and data, discuss the extent to which the ready-made garments (RMG) sector in Bangladesh contributes to achieving the SDG of sustained, inclusive, and sustainable economic growth, full employment, and decent work.',
 tags:['Bangladesh','RMG','sustainable development','SDG','gender employment','working conditions','income inequality'],
 hints:['Sustained growth: RMG = 84% of exports; GDP growth from 5.6% to 8.1% — contribution is large','Inclusive: RMG employs 4 million, majority women; female labour force participation rising (29.8→36.4%)','Absolute poverty falling from 19.4% to 9.2%','BUT: inequality rising (Gini 0.32→0.40) — not fully inclusive','Decent work: safety improvements post-Rana Plaza 2013; minimum wage raised; inspections','STILL: working conditions remain poor; many informal sector jobs insecure','Sustainable: "green garments" initiatives — but only 100 factories certified','Risk: ELDC graduation by 2026 → lose preferential access; US tariffs already 15%']},

/* ── POVERTY & EQUITY ── */
{cat:'pov',diff:'easy',marks:4,type:'Explain (Diagram)',src:'M22 · P2 Q2e',
 q:'Using a poverty cycle diagram, explain how the provision of free primary and secondary education may help households break the poverty cycle in Sierra Leone.',
 tags:['poverty cycle','education','human capital','Sierra Leone','virtuous cycle'],
 hints:['Draw poverty cycle: low income → low savings → low investment → low productivity → low income','Free education breaks cycle: low income households can send children to school at no cost','Education → higher human capital → higher productivity → higher future income','Also: household income freed from education fees → can invest in farming equipment','Modern farming curriculum → higher agricultural productivity → food security']},

{cat:'pov',diff:'easy',marks:4,type:'Explain (Diagram)',src:'N22 · P2 Q1f',
 q:'Using a Lorenz curve diagram, explain what happened to the distribution of income in Bangladesh between 2010 and 2019.',
 tags:['Lorenz curve','income distribution','inequality','Gini coefficient','Bangladesh'],
 hints:['Draw Lorenz curve diagram with line of equality','Gini coefficient rose from 0.32 to 0.40 → income distribution became more unequal','2019 Lorenz curve should bow further from line of equality than 2010 curve','RMG sector growth mainly benefited those already employed; informal sector fell behind']},

{cat:'pov',diff:'easy',marks:4,type:'Explain (Diagram)',src:'N21 · P2 Q4c',
 q:'Using a Lorenz curve diagram, explain what is meant by an increase in income inequality in Tanzania from 2015 to 2019.',
 tags:['Lorenz curve','income inequality','Tanzania','Gini coefficient'],
 hints:['Draw two Lorenz curves: 2015 closer to line of equality; 2019 further away','The 2019 curve bows further out from the 45° equality line','Means: bottom X% of population earn a smaller share of total income in 2019 vs. 2015','Link to context: growth benefited higher-income groups; poor population rising due to population growth']},

{cat:'pov',diff:'hard',marks:15,type:'Evaluate',src:'N21 · P1 Q4b',
 q:'Evaluate the view that progressive income tax is the best way to increase equity in an economy.',
 tags:['progressive tax','equity','income redistribution','tax avoidance','alternative policies','transfer payments'],
 hints:['Define progressive income tax (higher rates for higher incomes) and equity','How it works: higher earners pay more → funds public services (healthcare, education) benefiting all','Reduces after-tax income inequality → increases equity','Limitations: disincentive to work/invest (Laffer curve); avoidance/evasion by high earners','Rich may relocate businesses or income offshore','Alternative 1: Transfer payments (UBI, welfare benefits) — more direct redistribution','Alternative 2: Better labour market functioning (minimum wage, anti-discrimination)','Alternative 3: Public goods spending (education, healthcare) — equalises opportunities','Award max [12] if no alternative policy considered']},

/* ── SUPPLY & DEMAND (new) ── */
{cat:'sd',diff:'easy',marks:10,type:'Explain',src:'M19 TZ2 · P1 Q1a',
 q:'Explain two factors which could shift a firm\'s supply curve to the left.',
 tags:['supply shift','costs of production','indirect tax','supply determinants'],
 hints:['Define supply and supply curve','Draw diagram: supply curve shifting left','Factor 1: increase in costs of production (wages, raw materials) → less profitable to produce at each price','Factor 2: increase in indirect taxes → raises production costs → supply falls','Other valid factors: rise in price of related good in production, adverse weather, regulations','Award max [6] if only one factor explained']},

{cat:'sd',diff:'medium',marks:10,type:'Explain',src:'N19 · P1 Q2a',
 q:'Explain the view that the best allocation of resources occurs when consumer surplus and producer surplus are maximized.',
 tags:['consumer surplus','producer surplus','allocative efficiency','market equilibrium'],
 hints:['Define consumer surplus (area above price, below demand curve) and producer surplus (area below price, above supply curve)','Draw D&S diagram showing both areas at equilibrium','At equilibrium: total welfare (CS + PS) is maximised — no deadweight loss','Explain: at any other price/quantity, some surplus is lost → inefficient allocation','Resources flow to their highest-valued use when market clears','Examples: competitive markets that clear efficiently, e.g., commodity markets']},

/* ── ELASTICITY (new) ── */
{cat:'ela',diff:'medium',marks:10,type:'Explain',src:'N19 · P1 Q1a',
 q:'Explain two reasons why the demand for manufactured goods might be price elastic.',
 tags:['PED','price elastic','manufactured goods','substitutes','luxury goods'],
 hints:['Define price elasticity of demand (PED) and what "price elastic" means (PED > 1)','Draw diagram with elastic demand curve (flatter)','Reason 1: Availability of many close substitutes — consumers can easily switch brand (e.g., smartphones, clothing)','Reason 2: Goods are luxuries rather than necessities — consumers willing to reduce/delay purchase if price rises','Other valid reasons: proportion of income spent (high → more elastic); time available to adjust','Award max [6] (Level 2 ceiling) if only one reason explained']},

{cat:'ela',diff:'hard',marks:15,type:'Evaluate',src:'N19 · P1 Q1b',
 q:'Evaluate the importance of cross price elasticity of demand (XED) for a business selling a good if the price of a related good increases.',
 tags:['XED','cross-price elasticity','substitutes','complements','revenue','demand shift'],
 hints:['Define XED = % change in Qd of good A / % change in P of good B','Positive XED = substitutes; negative XED = complements','If substitute rises in price: demand for your good increases → higher TR (diagram: D shifts right)','If complement rises in price: demand for your good decreases → lower TR (diagram: D shifts left)','Evaluate: size of XED matters — weak substitutes/complements have small effects','Limitation: XED is difficult to measure in practice; ceteris paribus rarely holds','Real-world: e.g., Apple AirPods and iPhones (complements); Pepsi and Coca-Cola (substitutes)','Most important: firm must identify correctly whether goods are substitutes or complements to avoid mispricing']},

/* ── PRICE CEILINGS (new) ── */
{cat:'pc',diff:'medium',marks:10,type:'Explain',src:'M19 TZ1 · P1 Q2a',
 q:'Explain why a government might decide to impose a price ceiling on goods and services such as essential foods or rented housing.',
 tags:['price ceiling','maximum price','essential goods','equity','housing','market power'],
 hints:['Define price ceiling (maximum price set below equilibrium)','Draw diagram showing ceiling below equilibrium → excess demand (shortage)','Reason 1: Equity — to make essential goods affordable for low-income households (e.g., bread, rent)','Reason 2: Counter market power — if monopoly supplier charges excessive prices','Reason 3: Political reasons — popular policy; seen to protect vulnerable groups','Examples: rent controls in NYC/Berlin; fuel price caps; food price controls in low-income countries']},

{cat:'pc',diff:'hard',marks:15,type:'Discuss',src:'N20 · P1 Q2b',
 q:'Discuss the consequences for different stakeholders when the government imposes a price ceiling on a market.',
 tags:['price ceiling','stakeholders','shortage','black market','consumers','producers','government'],
 hints:['Define price ceiling (maximum price below equilibrium); draw diagram showing shortage','Consumers (lucky): benefit from lower price — gain consumer surplus if they can buy','Consumers (unlucky): face shortage — queuing, rationing, black markets; some cannot access good at all','Producers: receive lower price → fall in revenue and profit; may reduce quality or exit market','Workers: producers may cut costs → possible job losses','Government: administrative cost; risk of parallel markets; may need to ration the good','Evaluate: effectiveness depends on enforcement, elasticities, and whether alternative rationing exists','Real-world: rent controls in Berlin/San Francisco; petrol price caps in Venezuela']},

/* ── PRICE FLOORS (new) ── */
{cat:'pf',diff:'easy',marks:10,type:'Explain',src:'N20 · P1 Q2a',
 q:'Explain the impact of a price floor on market outcomes.',
 tags:['price floor','minimum price','surplus','welfare','market outcomes'],
 hints:['Define price floor (minimum price set above equilibrium)','Draw diagram: price floor creates surplus (Qs > Qd)','Impact 1: Price rises above equilibrium → consumers pay more, quantity demanded falls','Impact 2: Quantity supplied rises above quantity demanded → unsold surplus','Impact 3: Government may need to purchase surplus → costly','Impact 4: Welfare loss (deadweight loss) triangle between Qd and Qs at the floor price','Note: price floor on demerit goods (e.g., minimum alcohol price) can be rewarded']},

/* ── EXTERNALITIES & MARKET FAILURE (new) ── */
{cat:'ext',diff:'medium',marks:10,type:'Explain',src:'N20 · P1 Q1a',
 q:'Explain how production that causes pollution leads to market failure.',
 tags:['negative production externality','market failure','MSC','MPC','pollution','over-production'],
 hints:['Define market failure and negative production externality','Draw diagram: MSC above MPC; market produces Qm > socially optimal Qs','Polluting firms only bear private costs (MPC), not social costs (MSC = MPC + external costs)','Result: over-production relative to socially optimal level → too many resources allocated to polluting industry','Welfare loss = deadweight loss triangle between Qs and Qm','Examples: coal power stations, chemical plants, intensive farming']},

{cat:'ext',diff:'medium',marks:10,type:'Explain',src:'M19 TZ2 · P1 Q2a',
 q:'Explain why public transport, such as buses and trains, might be under-provided in a market economy.',
 tags:['positive externality','public transport','under-provision','MSB','MPB','merit good'],
 hints:['Define under-provision and positive externality of consumption','Draw diagram: MSB > MPB; market produces Qm < socially optimal Qs','Private market only considers MPB (rider\'s benefit), not external benefits (reduced congestion, pollution)','MSB > MPB → positive externality of consumption → market under-provides','Result: welfare loss between Qm and Qs — too little public transport provided','Also: large fixed costs and network effects make private provision difficult','Examples: UK bus services; metro systems in developing countries; rural rail lines']},

{cat:'ext',diff:'hard',marks:15,type:'Discuss',src:'N20 · P1 Q1b',
 q:'Discuss whether government regulation is the most effective way to deal with negative externalities of consumption.',
 tags:['negative externality of consumption','government regulation','Pigouvian tax','demerit goods','policy comparison'],
 hints:['Define negative externalities of consumption; draw MPB vs MSB diagram','Regulation: e.g., banning smoking in public places, compulsory safety standards → shifts MPB toward MSB','Advantages of regulation: direct, certain outcome, difficult to avoid, can be targeted','Disadvantages: costly to enforce; may not achieve socially optimal level; black market risk','Alternative 1: Indirect tax (Pigouvian) → raises price to consumer, reduces consumption, raises revenue','Alternative 2: Advertising campaigns → shifts MPB rightward (education)','Alternative 3: Subsidise substitutes with fewer externalities','Evaluate "most effective": depends on nature of externality, enforcement capacity, demand elasticity','NB: Must consider alternative to regulation to reach full marks']},

{cat:'ext',diff:'hard',marks:15,type:'Discuss',src:'M19 TZ2 · P1 Q2b',
 q:'Discuss the view that imposing an indirect tax on gasoline (petrol) is the most effective way of reducing the market failure caused by cars.',
 tags:['indirect tax','negative externality','gasoline','cars','congestion','pollution','policy comparison'],
 hints:['Draw negative externality of production/consumption diagram for cars; show MSC > MPC','Indirect tax on petrol: shifts supply left → higher price → less driving → internalises externality','Advantages: market-based, raises government revenue, incentivises fuel efficiency','Disadvantages: regressive (higher burden on low-income drivers); imprecise (taxes fuel not congestion directly)','PED of petrol tends to be inelastic → large price rise needed for small reduction in consumption','Alternatives: congestion charges (more targeted); subsidise public transport; electric car subsidies; regulations (emission standards)','Evaluate: combination of policies likely needed; petrol tax alone insufficient if inelastic demand','Consider: environmental concern, distributional effects, alternative technology']},

/* ── GOVERNMENT INTERVENTION (new) ── */
{cat:'gov',diff:'hard',marks:15,type:'Evaluate',src:'M19 TZ1 · P1 Q2b',
 q:'Evaluate the view that the most effective way in which the government can encourage the consumption of merit goods is through direct provision.',
 tags:['merit goods','direct provision','under-consumption','positive externality','subsidies','vouchers'],
 hints:['Define merit goods (under-consumed at free market price due to positive externalities or imperfect information)','Direct provision: government provides the good free/at low cost (e.g., state education, NHS)','Advantages: ensures universal access; corrects under-consumption; reaches low-income groups','Disadvantages: expensive (opportunity cost); possible inefficiency; free riders; government may over/under-provide','Alternative 1: Subsidies → lower price → increase consumption, preserves market mechanism','Alternative 2: Maximum price (price ceiling) → makes good affordable but creates shortage risk','Alternative 3: Legislation (compulsory wearing of seatbelts, mandatory schooling)','Alternative 4: Advertising/information campaigns → shifts preferences','NB: Must consider alternatives — maximum Level 3 if no alternatives discussed']},

{cat:'gov',diff:'hard',marks:15,type:'Discuss',src:'N19 · P1 Q2b',
 q:'Discuss the implications of the direct provision of public goods by a government.',
 tags:['public goods','direct provision','non-excludable','non-rival','free rider','government failure'],
 hints:['Define public goods: non-excludable + non-rival (e.g., national defence, street lighting, flood defence)','Free-rider problem → market will under-provide or not provide at all','Government direct provision corrects market failure → ensures public goods are available','Positive implications: all citizens benefit; national security maintained; no free-rider problem','Negative implications: opportunity cost of government spending; risk of government failure (inefficient production)','Government must decide quantity to provide — difficult without price signals','Private sector can sometimes provide (e.g., toll roads as quasi-public goods)','Evaluation: public goods are non-rival — provision to extra user costs nothing; key challenge is funding (taxation)']},

{cat:'gov',diff:'hard',marks:15,type:'Discuss',src:'M19 TZ2 · P1 Q1b',
 q:'Discuss the view that the provision of subsidies by the government on goods such as agricultural products will always be beneficial to stakeholders.',
 tags:['subsidies','agricultural products','stakeholders','market distortion','government spending','equity'],
 hints:['Define subsidy; draw diagram showing supply shifting right → lower price, higher quantity','Producers: receive higher price (including subsidy) → higher revenue and profit','Consumers: pay lower price → gain consumer surplus; improved access to food','Government: bears cost of subsidy → opportunity cost (could fund schools, hospitals)','Workers: employment in subsidised industry may be protected','Not always beneficial: market distortion → inefficient resource allocation','May protect inefficient domestic producers; discourages productivity improvements','WTO rules may be violated; trading partners may retaliate (e.g., EU agricultural subsidies hurt developing-country farmers)','Evaluate: benefits depend on PED/PES, whether subsidy is targeted, who receives it, and fiscal cost']},

/* ── AD/AS MODEL (new) ── */
{cat:'adas',diff:'medium',marks:10,type:'Explain',src:'M19 TZ1 · P1 Q3a',
 q:'Explain how aggregate demand in an economy might be affected by a rise in the exchange rate and a decrease in the income of major trading partners.',
 tags:['aggregate demand','exchange rate','trading partner income','net exports','AD shift'],
 hints:['Define aggregate demand (AD = C + I + G + X − M)','Draw AD/AS diagram: AD shifts left','Rise in exchange rate: exports become more expensive abroad → X falls; imports become cheaper → M rises → net exports (X−M) fall','Decrease in income of major trading partners: they import less → country\'s exports fall → X falls further','Both factors reduce the X−M component of AD → AD shifts left','Real output falls; price level may fall (or be less inflationary)','Examples: UK post-Brexit sterling depreciation (opposite effect); Japan and the 2008 US recession','Award max [6] (Level 2) if only one factor addressed']},

{cat:'adas',diff:'medium',marks:10,type:'Explain',src:'M19 TZ2 · P1 Q4a',
 q:'Explain the various phases of the business cycle.',
 tags:['business cycle','boom','recession','slump','recovery','GDP trend'],
 hints:['Define the business cycle (short-run fluctuations of real GDP around the long-run trend)','Draw business cycle diagram: real GDP on y-axis, time on x-axis; show trend line and cyclical fluctuations','Boom/Peak: GDP above trend; low unemployment; possible inflationary pressure; high business confidence','Recession: GDP falling for two consecutive quarters; rising unemployment; falling investment','Slump/Depression: GDP significantly below trend; high unemployment; deflation possible','Recovery: GDP rising; unemployment beginning to fall; investment picks up','Examples: 2008–09 Global Financial Crisis (recession); 1990s US expansion (boom)','NB: Diagrams of the business cycle may vary — be flexible in crediting']},

{cat:'adas',diff:'medium',marks:10,type:'Explain',src:'N20 · P1 Q3a',
 q:'Explain how a decrease in business confidence can affect the real GDP of an economy that is producing below the full employment level of output.',
 tags:['business confidence','investment','aggregate demand','real GDP','deflationary gap'],
 hints:['Define real GDP, business confidence, full employment level of output','Draw AD/AS diagram: economy already below Yfe; then AD shifts further left','Business confidence is a key determinant of investment (I)','↓ Business confidence → ↓ investment → ↓ AD (I is a component of AD = C+I+G+X−M)','AD shifts left → real GDP falls further below potential → deflationary gap widens','May trigger multiplier: falling AD reduces incomes → further fall in consumption → further AD reduction','Real-world: 2008–09 collapse in business confidence following Lehman Brothers bankruptcy']},

{cat:'adas',diff:'hard',marks:15,type:'Evaluate',src:'N20 · P1 Q3b',
 q:'Evaluate the view that a decrease in aggregate demand would always be deflationary.',
 tags:['aggregate demand','deflation','Keynesian model','monetarist model','price level','wage rigidity'],
 hints:['Define deflation (falling general price level) vs disinflation (falling rate of inflation)','In the neoclassical/monetarist model: AD falls → new equilibrium at lower price level → deflationary','In the Keynesian model (below full employment): AD falls but wage/price rigidity means price level stays flat → output falls but not prices','So the effect depends on: model used, where economy is operating on AS curve','Keynesian horizontal range: AD fall → only output falls, not prices','If AD falls when economy is at full employment → deflationary','Evaluate: "always" is too strong — price stickiness means deflation is NOT guaranteed when AD falls','Real-world: 2009 Great Recession — output fell but prices did not always deflate']},

{cat:'adas',diff:'hard',marks:15,type:'Discuss',src:'M19 TZ2 · P1 Q4b',
 q:'Discuss the view that economies will always return to the full employment level of output in the long run.',
 tags:['full employment','long run','monetarist','Keynesian','self-correction','LRAS','AD'],
 hints:['Define full employment and full employment level of output','Monetarist/Classical view: YES — wages and prices are flexible; below full employment → wages fall → SRAS shifts right → economy self-corrects to Yfe','Draw: AD falls → Keynesian/Monetarist SRAS adjustment back to Yfe','Keynesian view: NO — wages and prices are sticky downward; economy can remain stuck in deflationary gap','Keynes: "In the long run we are all dead" — government intervention needed','Evidence: Great Depression 1930s — US economy did NOT self-correct quickly; needed New Deal','Post-2008: many economies took years to recover, requiring fiscal/monetary stimulus','Evaluate: "always" is too strong; speed and completeness of return depends on institutional flexibility, labour market structure, government policy']},

/* ── MONETARY POLICY (new) ── */
{cat:'mon',diff:'medium',marks:10,type:'Explain',src:'N19 · P1 Q3a',
 q:'Explain why a reduction in interest rates might lead to an increase in aggregate demand.',
 tags:['interest rates','monetary policy','aggregate demand','consumption','investment'],
 hints:['Define aggregate demand and interest rates','Draw AD/AS diagram: AD shifts right as interest rates fall','Lower interest rates: cheaper to borrow → households increase consumer spending (C) on credit','Lower rates: lower return on savings → less incentive to save → more spending','Lower rates: cheaper for firms to borrow → business investment (I) increases','Lower rates: currency may depreciate → exports cheaper abroad → net exports (X−M) rise','All components: C, I and X−M can rise → AD shifts right','Examples: Bank of England cutting rates post-2008; ECB negative rates 2014–2022']},

{cat:'mon',diff:'hard',marks:15,type:'Evaluate',src:'N19 · P1 Q3b',
 q:'Evaluate the view that expansionary monetary policy is the most effective way to achieve economic growth.',
 tags:['expansionary monetary policy','economic growth','interest rates','AD','fiscal policy','supply-side'],
 hints:['Expansionary monetary policy: lower interest rates (or QE) → ↑ C, ↑ I → AD shifts right → higher real GDP and growth','Advantages: quick to implement (central bank acts fast); no political interference (independent CB); incremental adjustments possible','Disadvantages: liquidity trap — rates at zero lower bound (ZLB); "pushing on a string" if confidence is low','Time lags: 12–18 months for full effect on economy','Does not address structural weaknesses (supply-side issues)','Alternative 1: Expansionary fiscal policy — more direct (government spending on infrastructure, tax cuts)','Alternative 2: Supply-side policies — raise productive capacity → sustainable long-term growth','Evaluate "most effective": context matters — in recession with room to cut rates, monetary policy effective; near ZLB, fiscal or supply-side better','Real-world: US near-zero rates 2008–2015; QE by Fed, ECB, BoE']},

/* ── FISCAL POLICY (new) ── */
{cat:'fis',diff:'hard',marks:15,type:'Evaluate',src:'M19 TZ1 · P1 Q3b',
 q:'To what extent is expansionary fiscal policy the best policy to achieve a reduction in the rate of unemployment?',
 tags:['fiscal policy','unemployment','expansionary','AD','multiplier','structural unemployment'],
 hints:['Expansionary fiscal policy: ↑ G or ↓ T → AD shifts right → real GDP rises → demand for labour increases → unemployment falls','Effective for demand-deficient (cyclical) unemployment — addresses root cause (low AD)','Multiplier: initial spending has amplified effect on GDP and employment','Limitations: time lags in budget process; budget deficit and debt risk; crowding out','NOT effective for structural unemployment (skills mismatch) — need supply-side policies','NOT effective for frictional unemployment — need information/search improvements','Alternative: monetary policy (lower rates → ↑ investment → ↑ employment)','Alternative: market-based supply-side (flexible labour markets, training vouchers)','Evaluate "best": best for cyclical; inappropriate for structural; combination often optimal','NB: Must consider alternatives to reach Level 4']},

/* ── SUPPLY-SIDE POLICIES (new) ── */
{cat:'ssp',diff:'medium',marks:10,type:'Explain',src:'M19 TZ2 · P1 Q3a',
 q:'Explain how increased investment by the government in education and training can affect both aggregate demand and aggregate supply.',
 tags:['education investment','aggregate demand','LRAS','SRAS','human capital','supply-side'],
 hints:['Define aggregate demand and aggregate supply','Draw two diagrams: AD/AS showing AD shifting right (short run); then LRAS shifting right (long run)','Short-run effect: government spending on education increases G component of AD → AD shifts right → higher real GDP','Long-run effect: education/training increases human capital → higher labour productivity → SRAS and LRAS shift right → lower unit costs and higher potential output','Both effects: short-run demand stimulus + long-run supply enhancement','Examples: Singapore\'s education investment; South Korea\'s rapid human capital development']},

{cat:'ssp',diff:'hard',marks:15,type:'Evaluate',src:'M19 TZ2 · P1 Q3b',
 q:'Evaluate the view that inflationary pressures in an economy are best reduced using supply-side policies.',
 tags:['supply-side policy','inflation','cost-push','demand-pull','LRAS','monetary policy'],
 hints:['Define inflation and supply-side policies (market-based: deregulation, privatisation; interventionist: education, subsidies)','Supply-side → LRAS shifts right → lower long-run price level → reduces inflationary pressure','Advantage for cost-push inflation: increases productive capacity, lowers unit costs → SRAS shifts right too','Advantage: no output sacrifice (unlike contractionary monetary/fiscal policy)','Also boosts employment and economic efficiency simultaneously','Disadvantages: long time lags (years before productivity gains materialise)','Less effective for demand-pull inflation (need demand-management: contractionary monetary or fiscal policy)','Alternative 1: Contractionary monetary policy (raise rates → ↓ AD → ↓ inflation) — faster but risks recession','Alternative 2: Contractionary fiscal policy (↑ taxes, ↓ G) — direct but politically difficult','Evaluate: supply-side best for cost-push and structural inflation; monetary/fiscal better for demand-pull']},

/* ── DEVELOPMENT & GROWTH (new) ── */
{cat:'dev',diff:'medium',marks:10,type:'Explain',src:'N19 · P1 Q4a',
 q:'Explain, using a production possibilities curve (PPC) diagram, an increase in the actual output of an economy.',
 tags:['PPC','actual output','economic growth','resource utilisation','AD/AS'],
 hints:['Define production possibilities curve (PPC) and actual output','Draw PPC diagram: economy initially inside the PPC (unemployment/underutilisation)','Increase in actual output = movement toward the PPC (not a shift of the PPC itself)','Represents: previously unemployed or underused resources (labour, capital) being put to work','Caused by: higher AD, improved business confidence, lower interest rates','DISTINCT from increase in potential output (which shifts PPC outward)','Example: recovery from recession — 2009–2016 US recovery brought actual output toward potential']},

{cat:'dev',diff:'medium',marks:10,type:'Explain',src:'M19 TZ1 · P1 Q4a',
 q:'Explain the role of improved productivity in achieving economic growth.',
 tags:['productivity','economic growth','LRAS','SRAS','unit costs','output per worker'],
 hints:['Define productivity (output per unit of input, e.g., output per worker per hour)','Draw AD/AS diagram: improved productivity → SRAS shifts right (lower unit costs); also LRAS shifts right (higher productive capacity)','Short run: ↑ productivity → ↓ unit costs → SRAS right → higher real GDP + lower prices','Long run: ↑ productivity → ↑ LRAS → higher potential output','Source of productivity gains: better technology, education, training, improved management, economies of scale','Example: German manufacturing productivity; South Korea\'s TFP growth 1990s','NB: Must show understanding of productivity specifically — max Level 2 if productivity not clearly defined and applied']},

{cat:'dev',diff:'hard',marks:15,type:'Discuss',src:'N19 · P1 Q4b',
 q:'Discuss the view that economic growth always leads to a rise in living standards.',
 tags:['economic growth','living standards','inequality','environmental costs','GDP','HDI'],
 hints:['Define economic growth (rising real GDP) and living standards (HDI, income, welfare)','Draw PPC shifting outward or AD/AS showing growth','Economic growth CAN raise living standards: higher household incomes; more jobs; greater government tax revenue for public services','BUT: growth may NOT raise living standards if: distribution of income worsens (gains concentrated at top)','Environmental costs: pollution, climate change, depletion of natural resources reduce quality of life','Capital-intensive growth may increase unemployment despite rising GDP','Inflation may erode real income gains','"Kuznets curve": inequality may rise before it falls during development','Evaluate "always": too absolute — depends on quality, distribution, and environmental sustainability of growth','Real-world: China — rapid GDP growth but environmental and inequality concerns; Bhutan — GNH vs GDP']},

{cat:'dev',diff:'hard',marks:15,type:'Discuss',src:'M19 TZ1 · P1 Q4b',
 q:'Discuss the view that economic growth can only be achieved at the expense of other macroeconomic objectives such as a low and stable rate of inflation and equity in the distribution of income.',
 tags:['economic growth','inflation','equity','macroeconomic objectives','trade-offs','Phillips curve'],
 hints:['Define economic growth; identify key macroeconomic objectives: low inflation, equity, low unemployment, external balance','AD-driven growth: rising AD → real GDP rises but may cause demand-pull inflation (moving along SRAS)','Growth may also worsen income distribution if gains accrue mainly to capital owners (Piketty argument)','BUT: supply-side driven growth (LRAS right) → higher GDP + lower prices simultaneously (no inflation trade-off)','Growth can reduce poverty → improve equity (trickle-down); fiscal expansion for growth can fund redistribution','Long-run growth may improve environmental technology → less conflict with environmental objectives','Evaluate "only": too absolute — the type of growth matters; supply-side growth avoids many trade-offs','Real-world: 1990s US new economy — growth with low inflation; 2000s China — growth with rising inequality','NB: At least two objectives must be considered; Level 4 requires two objectives and evaluation']},

/* ── POVERTY & EQUITY (new) ── */
{cat:'pov',diff:'medium',marks:10,type:'Explain',src:'N20 · P1 Q4a',
 q:'Explain how government expenditures are used to promote equity in the distribution of income.',
 tags:['government expenditure','equity','income distribution','transfer payments','merit goods','Lorenz curve'],
 hints:['Define government expenditure and equity (more equal distribution of income)','Optionally draw Lorenz curve: government spending shifts curve closer to line of equality','Transfer payments: welfare benefits, pensions, unemployment benefits → increase incomes of the poor','Free/subsidised merit goods: healthcare, education → reduce inequality of opportunity','Infrastructure spending in deprived areas → improves human capital and productivity of low-income groups','Progressive spending patterns: spending benefits lower-income groups proportionately more','Example: Scandinavian welfare states; UK NHS as equaliser of health outcomes']},

{cat:'pov',diff:'hard',marks:15,type:'Evaluate',src:'N20 · P1 Q4b',
 q:'Evaluate the impact on efficiency in the allocation of resources when the government uses taxation to promote equity.',
 tags:['taxation','equity','allocative efficiency','Laffer curve','disincentives','progressivity'],
 hints:['Define allocative efficiency (resources flow to highest-valued uses; P = MC) and equity','Progressive taxation reduces after-tax income inequality → improves equity','BUT: higher marginal tax rates → disincentive to work/invest → labour supply falls → allocative inefficiency','Laffer curve: beyond the revenue-maximising rate, higher taxes reduce tax revenue and output','Higher corporate taxes → less FDI → lower productive efficiency','Indirect taxes (VAT) to raise revenue: regressive → worsen equity; distort resource allocation','Capital gains taxes may discourage investment','Evaluation: trade-off between equity and efficiency is NOT fixed — depends on current tax levels, elasticities, design of tax','Nordic countries: high taxes AND high productivity → suggests trade-off is not inevitable','Evaluate: the efficiency loss depends on behavioural responses — empirical question']},

{cat:'sd',diff:'easy',marks:2,type:'Define',src:'M19 · P2 Q1a(i)',
 q:'Define the term "excess demand" as used in the context of the US tinplate steel market.',
 tags:['excess demand','disequilibrium','shortage'],
 hints:['Excess demand: situation where quantity demanded exceeds quantity supplied at a given price','Occurs when price is set below equilibrium','Results in a shortage','Example: US tinplate steel — domestic supply 1.2m tons vs demand 2.1m tons at the prevailing price']},

/* ── UNEMPLOYMENT (P2 easy definitions) ── */
{cat:'une',diff:'easy',marks:2,type:'Define',src:'M19 · P2 Q1a(ii)',
 q:'Define the term "structural unemployment" as used in the context of the tin can manufacturing industry.',
 tags:['structural unemployment','skills mismatch','industry decline'],
 hints:['Structural unemployment: unemployment arising from a permanent change in the structure of the economy','Caused by: technological change, shift in demand for particular industries or skills','Workers lack the skills demanded by expanding industries → need retraining','Example: tin can factory workers losing jobs if plant shuts down; cannot easily shift to other sectors']},

/* ── INTERNATIONAL TRADE (P2 easy definitions) ── */
{cat:'trade',diff:'easy',marks:2,type:'Define',src:'N19 · P2 Q1a(i)',
 q:'Define the term "quota" as used in the context of the Japan-EU trade agreement (JEEPA).',
 tags:['quota','trade restriction','non-tariff barrier'],
 hints:['Quota: a limit on the quantity (or sometimes value) of a good that can be imported or exported','A non-tariff barrier to trade','Effect: restricts supply of imported good → higher domestic price','Example: JEEPA — quota on camembert cheese imports into Japan, protecting domestic producers']},

{cat:'trade',diff:'easy',marks:2,type:'Define',src:'N20 · P2 Q2a(i)',
 q:'Define the term "tariff" as used in the context of US-China trade relations.',
 tags:['tariff','trade protection','import duty'],
 hints:['Tariff: a tax (duty) levied on imported goods','Raises the price of imports in the domestic market','Protects domestic producers from foreign competition; raises government revenue','Example: US imposed 25% tariff on Chinese steel imports']},

{cat:'trade',diff:'easy',marks:2,type:'Define',src:'N20 · P2 Q2a(ii)',
 q:'Define the term "trade war" as used in the context of US-China tariff escalation.',
 tags:['trade war','retaliation','protectionism'],
 hints:['Trade war: a situation where countries retaliate against each other by imposing escalating trade barriers (tariffs, quotas, etc.)','Each country tries to protect its domestic industries by restricting foreign goods','Results in reduced international trade; can harm both economies','Example: US tariffs on Chinese goods → China retaliates with ban on US soybeans']},

/* ── EXCHANGE RATES (P2 easy definitions) ── */
{cat:'exr',diff:'easy',marks:2,type:'Define',src:'M19 · P2 Q2a(i)',
 q:'Define the term "appreciation" as used in the context of the Indian rupee.',
 tags:['appreciation','exchange rate','currency value'],
 hints:['Appreciation: an increase in the value of a currency relative to another currency in a floating exchange rate system','Currency appreciates when demand for it rises relative to supply','Effect: exports become more expensive; imports become cheaper','Example: Indian rupee appreciated against the dollar — made Indian exports less competitive']},

{cat:'exr',diff:'easy',marks:2,type:'Define',src:'N19 · P2 Q2a(ii)',
 q:'Define the term "current account deficit" as used in the context of Canada\'s balance of payments.',
 tags:['current account deficit','balance of payments','trade deficit'],
 hints:['Current account deficit: situation where the outflows of a country\'s current account (imports, income, transfers) exceed its inflows (exports, income received, transfers received)','Includes trade in goods + services + primary income + secondary income','A deficit means the country is spending more on foreign goods/services than it earns from exports','Example: Canada\'s current account deficit = 3.6% of GDP; importing more than exporting']},

/* ── MONETARY POLICY (P2 easy definitions) ── */
{cat:'mon',diff:'easy',marks:2,type:'Define',src:'M19 · P2 Q2a(ii)',
 q:'Define the term "monetary policy" as used in the context of the Reserve Bank of India.',
 tags:['monetary policy','interest rates','central bank','money supply'],
 hints:['Monetary policy: actions taken by a central bank to influence the money supply and interest rates to achieve macroeconomic objectives','Tools: changing official interest rate, open market operations, reserve requirements, QE','Expansionary: lower rates → ↑ AD → ↑ growth; Contractionary: higher rates → ↓ inflation','Example: Reserve Bank of India adjusting interest rates to manage the rupee and inflation']},

{cat:'mon',diff:'easy',marks:2,type:'Outline',src:'N19 · P2 Q2a(i)',
 q:'Outline two roles of a country\'s central bank.',
 tags:['central bank','monetary policy','lender of last resort','financial stability'],
 hints:['Role 1: Setting official interest rate to achieve inflation target and support economic growth','Role 2: Lender of last resort — provides emergency funds to commercial banks to prevent banking collapse','Other valid roles: manage foreign exchange reserves; issue currency; supervise and regulate banks; manage government debt','Example: Bank of Canada raised rates to 0.75% to manage inflationary pressure']},

/* ── DEVELOPMENT (P2 easy definitions) ── */
{cat:'dev',diff:'easy',marks:2,type:'Define',src:'N19 · P2 Q1a(ii)',
 q:'Define the term "sustainability" as used in the context of the Japan-EU trade agreement.',
 tags:['sustainability','long-term development','environment'],
 hints:['Sustainability: the ability to meet the needs of the present without compromising the ability of future generations to meet their own needs','Economic sustainability: growth that doesn\'t deplete resources or cause irreversible environmental damage','JEEPA context: trade agreement promotes cooperation AND environmental conservation for long-term growth','Link to SDGs and green economy']},

{cat:'dev',diff:'easy',marks:2,type:'Define',src:'M19 · P2 Q3a(i)',
 q:'Define the term "concessional long-term loans" as used in the context of Bhutan\'s hydropower funding.',
 tags:['concessional loans','development finance','tied aid','low interest rate'],
 hints:['Concessional loan: a loan offered at below-market interest rates and/or with a long repayment period','Provided by governments or multilateral institutions (World Bank, IMF) to developing countries','Better terms than commercial loans → eases debt servicing burden','Example: India financing Bhutan\'s hydropower projects with concessional loans — repaid from electricity export revenues']},

{cat:'dev',diff:'easy',marks:2,type:'Define',src:'M19 · P2 Q3a(ii)',
 q:'Define the term "real gross domestic product (GDP)" as used in the context of Bhutan\'s growth.',
 tags:['real GDP','GDP','inflation adjustment','national income'],
 hints:['Real GDP: the total value of all goods and services produced in a country in a given period, adjusted for inflation','Distinction: nominal GDP uses current prices; real GDP uses constant base-year prices → removes effect of price changes','Measures changes in actual productive output, not just changes in price level','Example: Bhutan\'s real GDP growth expected at 11.7% by 2019 — reflects genuine expansion of output']},

{cat:'dev',diff:'easy',marks:2,type:'Define',src:'N19 · P2 Q3a(i)',
 q:'Define the term "micro-credit" as used in the context of economic development in Côte d\'Ivoire.',
 tags:['micro-credit','microfinance','poverty','small loans','entrepreneurship'],
 hints:['Micro-credit: the provision of small loans to low-income individuals or small businesses who lack access to conventional banking','Enables entrepreneurship and investment for those in poverty','Key characteristic: small loan size, often targeted at women in developing countries','Example: Grameen Bank model; micro-credit for cocoa farmers or women entrepreneurs in Côte d\'Ivoire']},

{cat:'dev',diff:'easy',marks:2,type:'Define',src:'N19 · P2 Q3a(ii)',
 q:'Define the term "gross national income (GNI)" as used in Table 3 for Côte d\'Ivoire.',
 tags:['GNI','national income','income per capita','development measure'],
 hints:['GNI: the total income earned by a country\'s residents, regardless of where production takes place','GNI = GDP + net income from abroad (wages, profits, rents earned abroad minus those earned by foreigners domestically)','GNI per capita = GNI ÷ population — used as measure of average living standards','Example: Table 3 shows female GNI per capita (PPP) = $2,136 vs male $4,155 — reveals gender income gap in Côte d\'Ivoire']},

{cat:'dev',diff:'easy',marks:2,type:'Define',src:'N19 · P2 Q4a(i)',
 q:'Define the term "official development assistance (ODA)" as used in the context of Nepal.',
 tags:['ODA','foreign aid','development assistance','grants','loans'],
 hints:['ODA: grants or concessional loans from government donors (bilateral) or multilateral institutions to developing countries','Purpose: promote economic development and welfare in recipient countries','Must be concessional (grant element ≥ 25%)','Example: foreign aid to Nepal for post-earthquake reconstruction of bridges, roads, infrastructure']},

{cat:'dev',diff:'easy',marks:2,type:'Define',src:'N19 · P2 Q4a(ii)',
 q:'Define the term "infrastructure" as used in the context of Nepal\'s reconstruction needs.',
 tags:['infrastructure','economic development','public capital','transport'],
 hints:['Infrastructure: the basic physical and organisational structures and facilities needed for an economy to function','Includes: roads, bridges, railways, airports, electricity grids, water supply, telecommunications','Essential for economic activity — reduces transport costs, connects markets, enables trade','Example: Nepal\'s earthquake damaged bridges and roads → reduced production possibilities → ODA needed for reconstruction']},

{cat:'dev',diff:'easy',marks:2,type:'Define',src:'N20 · P2 Q3a(ii)',
 q:'Define the term "human capital" as used in the context of economic development in Pakistan.',
 tags:['human capital','education','skills','productivity','development'],
 hints:['Human capital: the skills, knowledge, experience, and health of a workforce that make them productive','Built through: education, training, healthcare, on-the-job learning','Investment in human capital → higher productivity → higher GDP per capita → economic development','Example: Pakistan needs better education quality and female participation to build human capital for economic growth']},

/* ── FISCAL POLICY (P2 easy definitions) ── */
{cat:'fis',diff:'easy',marks:2,type:'Define',src:'N20 · P2 Q1a(i)',
 q:'Define the term "budget deficit" as used in the context of Argentina\'s fiscal situation.',
